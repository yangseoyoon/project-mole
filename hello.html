<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>HELLO | DOT SHIFT</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      h1 {
        font-family: sans-serif;
        font-size: 120px;
        color: #fff;
        letter-spacing: -4px;
        opacity: 0;
        animation: fadeIn 0.8s 0.1s ease forwards;
      }
      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <h1>HELLO</h1>
  <script src="sound.js"></script>
  </body>
