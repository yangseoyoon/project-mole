    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Pretendard', sans-serif;
        background: #fff;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      .resultPage {
        position: fixed;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
      }

      /* 채팅 영역 */
      .chat-wrap {
        position: absolute;
        top: 44px;
        bottom: 108px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
      }

      /* 헤더 */
      .chat-header {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 70px;
        border-bottom: 1px solid #e5e5e5;
        flex-shrink: 0;
        position: relative;
      }
      .chat-header-title {
        font-size: 24px;
        font-weight: 600;
        color: #000;
      }
      .chat-header-back {
        position: absolute;
        left: 48px;
        font-size: 20px;
        font-weight: 500;
        color: #555;
        background: none;
        border: none;
        cursor: pointer;
        padding: 10px 18px;
        border-radius: 8px;
        transition: background 0.15s;
      }
      .chat-header-back:hover {
        background: #f3f3f3;
      }

      /* 메시지 스크롤 영역 */
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 64px 400px;
        display: flex;
        flex-direction: column;
        gap: 52px;
      }

      /* 메시지 공통 */
      .msg {
        display: flex;
        flex-direction: column;
        gap: 12px;
        opacity: 0;
        transform: translateY(14px);
        animation: msgIn 0.45s ease forwards;
      }
      @keyframes msgIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 사용자 메시지 (오른쪽) */
      .msg--user {
        align-items: flex-end;
      }
      .msg--user .msg-photo {
        width: 300px;
        height: 366px;
        border-radius: 18px;
        object-fit: cover;
        border: 1px solid #e0e0e0;
        background: #f0f0f0;
      }
      .msg--user .msg-bubble {
        background: #f0f0f0;
        color: #000;
        font-size: 22px;
        font-weight: 500;
        padding: 16px 24px;
        border-radius: 22px 22px 6px 22px;
        max-width: 500px;
        line-height: 1.5;
      }

      /* AI 메시지 (왼쪽) */
      .msg--ai {
        align-items: flex-start;
      }
      .msg--ai .msg-row {
        display: flex;
        align-items: flex-start;
        gap: 18px;
      }
      .msg-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #e9f056;
        border: 1.5px solid #000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 800;
        color: #000;
        flex-shrink: 0;
        letter-spacing: -1px;
      }
      .msg-bubble-ai {
        font-size: 22px;
        font-weight: 400;
        color: #000;
        line-height: 1.75;
        max-width: 920px;
      }

      /* 타이핑 도트 */
      .typing-dots {
        display: flex;
        gap: 7px;
        padding: 18px 4px;
      }
      .typing-dots span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #bbb;
        animation: dot 1.2s infinite ease-in-out;
      }
      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes dot {
        0%,
        80%,
        100% {
          transform: scale(0.7);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* 결과 카드 */
      .result-card {
        border: 1px solid #e0e0e0;
        border-radius: 18px;
        padding: 40px 44px;
        max-width: 880px;
        background: #fafafa;
      }
      .result-code {
        font-size: 16px;
        font-weight: 600;
        color: #aaa;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }
      .result-type {
        font-size: 36px;
        font-weight: 700;
        color: #ea5c3a;
        margin-bottom: 18px;
        line-height: 1.3;
      }
      .result-desc {
        font-size: 21px;
        font-weight: 400;
        color: #222;
        line-height: 1.8;
        margin-bottom: 32px;
      }
      .result-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .result-tag {
        background: #e9f056;
        border: 1px solid #000;
        border-radius: 100px;
        padding: 9px 22px;
        font-size: 19px;
        font-weight: 600;
        color: #000;
      }

      /* 두 번째 AI 메시지: 추가 코멘트 */
      .comment-bubble {
        font-size: 22px;
        font-weight: 400;
        color: #000;
        line-height: 1.75;
        max-width: 880px;
      }

      /* 하단 액션 */
      .chat-actions {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        height: 100px;
        border-top: 1px solid #e5e5e5;
      }
      .action-btn {
        height: 60px;
        padding: 0 44px;
        border-radius: 100px;
        border: 1.5px solid #000;
        font-family: 'Pretendard', sans-serif;
        font-size: 22px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .action-btn--primary {
        background: #000;
        color: #fff;
      }
      .action-btn--primary:hover {
        background: #333;
      }
      .action-btn--secondary {
        background: #fff;
        color: #000;
      }
      .action-btn--secondary:hover {
        background: #f3f3f3;
      }
    </style>
  </head>

          name: '중심형 공감가',
          desc: '얼굴 정중앙에 단일 점이 위치한 유형입니다. 타인의 감정을 정확히 읽고 중심에서 공감하는 능력이 뛰어납니다.',
          tags: ['#공감력', '#감수성', '#중심', '#배려'],
        },
        NONE: {
          name: '자유형 잠재력',
          desc: '점이 찍히지 않은 유형입니다. 관상학에서는 점이 없는 것도 하나의 특성입니다. 어떤 방향으로도 성장할 수 있는 열린 가능성을 지닌 상입니다.',
          tags: ['#무한가능성', '#자유로움', '#적응력', '#잠재력'],
        },
      };

      // 궁별 코멘트
      const PALACE_COMMENT = {
        관록궁: '이마 중앙(관록궁)의 점 — 직업운과 사회적 성취를 나타냅니다.',
        복덕궁: '이마 우측(복덕궁)의 점 — 복과 덕이 쌓이는 위치입니다.',
        상모궁: '관자놀이(상모궁)의 점 — 외모와 첫인상의 운을 상징합니다.',
        처첩궁: '눈꼬리(처첩궁)의 점 — 인연과 애정운을 나타냅니다.',
        남녀궁: '볼 오른쪽(남녀궁)의 점 — 자녀운과 생명력을 의미합니다.',
        질액궁:
          '아래 볼(질액궁)의 점 — 건강과 체력 관리에 주의가 필요한 위치입니다.',
        지각궁: '턱 중앙(지각궁)의 점 — 말년운과 안정적인 토대를 나타냅니다.',
        전택궁:
          '왼쪽 아래 볼(전택궁)의 점 — 부동산운과 거주 환경을 상징합니다.',
        노복궁: '볼 왼쪽(노복궁)의 점 — 아랫사람과의 관계, 인복을 나타냅니다.',
        재백궁: '눈꼬리 왼쪽(재백궁)의 점 — 재물운과 경제적 능력을 의미합니다.',
        형제궁: '왼쪽 관자(형제궁)의 점 — 형제·동료와의 관계를 나타냅니다.',
        천이궁:
          '이마 좌측(천이궁)의 점 — 이동운과 변화에 강한 기질을 상징합니다.',
      };

      // ── 유형 매칭 ──
      function matchType(code) {
        if (!code || code === 'NONE') return 'NONE';
        return TYPE_MAP[code] ? code : 'NONE';
      }

      // ── 초기화 ──
      const savedFace =
        localStorage.getItem('capturedDots') ||
        localStorage.getItem('capturedFace');
      const rawCode = localStorage.getItem('resultType') || 'NONE';
      const dominantPalace = localStorage.getItem('dominantPalace') || '';
      const typeKey = matchType(rawCode);
      const data = TYPE_MAP[typeKey];

      // 사용자 사진
      const photoEl = document.getElementById('userPhoto');
      if (savedFace) photoEl.src = savedFace;

      // 결과 채우기
      document.getElementById('resultCode').textContent =
        rawCode !== 'NONE' ? `유형 코드: ${rawCode}` : '';
      document.getElementById('resultType').textContent = data.name;
      document.getElementById('resultDesc').textContent = data.desc;
      const tagsEl = document.getElementById('resultTags');
      data.tags.forEach((tag) => {
        const span = document.createElement('span');
        span.className = 'result-tag';
        span.textContent = tag;
        tagsEl.appendChild(span);
      });

      // 타이핑 도트 → 결과 카드 (1.8초 후)
      setTimeout(() => {
        document.getElementById('typingDots1').style.display = 'none';
        document.getElementById('resultCard').style.display = 'block';

        // 추가 코멘트 (3.5초 후): 궁 정보 우선, 없으면 기본 코멘트
        setTimeout(() => {
          const msg2 = document.getElementById('aiMsg2');
          msg2.style.display = 'flex';
          msg2.style.animation = 'msgIn 0.45s ease forwards';
          const comment =
            dominantPalace && PALACE_COMMENT[dominantPalace]
              ? PALACE_COMMENT[dominantPalace]
              : '관상에서 점은 단순한 점이 아니라 기운이 모이는 자리입니다. 변화하는 삶 속에서 점의 의미도 달라질 수 있습니다.';
          document.getElementById('commentBubble').textContent = comment;

          const chat = document.getElementById('chatMessages');
          chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' });
        }, 1700);
      }, 1800);
    </script>

    <script src="scale.js"></script>
    <script src="cursor.js"></script>
  </body>
</html>
