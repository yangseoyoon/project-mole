<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>분석 결과 | DOT SHIFT</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="nav.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Pretendard', sans-serif;
        background: #fff;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      .resultPage {
        position: fixed;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
      }

      /* 채팅 영역 */
      .chat-wrap {
        position: absolute;
        top: 44px;
        bottom: 108px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        background: #fff;
      }

      /* 헤더 */
      .chat-header {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 70px;
        border-bottom: 1px solid #e5e5e5;
        flex-shrink: 0;
        position: relative;
      }
      .chat-header-title {
        font-size: 24px;
        font-weight: 600;
        color: #000;
      }
      .chat-header-back {
        position: absolute;
        left: 48px;
        font-size: 20px;
        font-weight: 500;
        color: #555;
        background: none;
        border: none;
        cursor: pointer;
        padding: 10px 18px;
        border-radius: 8px;
        transition: background 0.15s;
      }
      .chat-header-back:hover {
        background: #f3f3f3;
      }

      /* 메시지 스크롤 영역 */
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 64px 400px;
        display: flex;
        flex-direction: column;
        gap: 52px;
      }

      /* 메시지 공통 */
      .msg {
        display: flex;
        flex-direction: column;
        gap: 12px;
        opacity: 0;
        transform: translateY(14px);
        animation: msgIn 0.45s ease forwards;
      }
      @keyframes msgIn {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 사용자 메시지 (오른쪽) */
      .msg--user {
        align-items: flex-end;
      }
      .msg--user .msg-photo {
        width: 300px;
        height: 366px;
        border-radius: 18px;
        object-fit: cover;
        border: 1px solid #e0e0e0;
        background: #f0f0f0;
      }
      .msg--user .msg-bubble {
        background: #f0f0f0;
        color: #000;
        font-size: 22px;
        font-weight: 500;
        padding: 16px 24px;
        border-radius: 22px 22px 6px 22px;
        max-width: 500px;
        line-height: 1.5;
      }

      /* AI 메시지 (왼쪽) */
      .msg--ai {
        align-items: flex-start;
      }
      .msg--ai .msg-row {
        display: flex;
        align-items: flex-start;
        gap: 18px;
      }
      .msg-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #e9f056;
        border: 1.5px solid #000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 800;
        color: #000;
        flex-shrink: 0;
        letter-spacing: -1px;
      }
      .msg-bubble-ai {
        font-size: 22px;
        font-weight: 400;
        color: #000;
        line-height: 1.75;
        max-width: 920px;
        background: #fafafa;
        border: 1px solid #e0e0e0;
        border-radius: 18px;
        padding: 28px 36px;
      }

      /* 타이핑 도트 */
      .typing-dots {
        display: flex;
        gap: 7px;
        padding: 18px 4px;
      }
      .typing-dots span {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #bbb;
        animation: dot 1.2s infinite ease-in-out;
      }
      .typing-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .typing-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes dot {
        0%,
        80%,
        100% {
          transform: scale(0.7);
          opacity: 0.4;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* 결과 카드 */
      .result-card {
        border: 1px solid #e0e0e0;
        border-radius: 18px;
        padding: 40px 44px;
        max-width: 880px;
        background: #fafafa;
      }
      .result-code {
        font-size: 16px;
        font-weight: 600;
        color: #aaa;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }
      .result-type {
        font-size: 36px;
        font-weight: 700;
        color: #ea5c3a;
        margin-bottom: 18px;
        line-height: 1.3;
      }
      .result-pattern {
        font-size: 18px;
        font-weight: 400;
        color: #666;
        line-height: 1.7;
        margin-bottom: 20px;
      }
      .result-palaces {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 28px;
      }
      .result-palace {
        background: #fff;
        border: 1px solid #000;
        border-radius: 100px;
        padding: 7px 18px;
        font-size: 17px;
        font-weight: 500;
        color: #000;
      }
      .result-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .result-tag {
        background: #e9f056;
        border: 1px solid #000;
        border-radius: 100px;
        padding: 9px 22px;
        font-size: 19px;
        font-weight: 600;
        color: #000;
      }

      /* 두 번째 AI 메시지: 추가 코멘트 */
      .comment-bubble {
        font-size: 22px;
        font-weight: 400;
        color: #000;
        line-height: 1.75;
        max-width: 880px;
      }

      /* 하단 액션 */
      .chat-actions {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        height: 100px;
        border-top: 1px solid #e5e5e5;
      }
      .action-btn {
        height: 60px;
        padding: 0 44px;
        border-radius: 100px;
        border: 1.5px solid #000;
        font-family: 'Pretendard', sans-serif;
        font-size: 22px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .action-btn--primary {
        background: #000;
        color: #fff;
      }
      .action-btn--primary:hover {
        background: #333;
      }
      .action-btn--secondary {
        background: #fff;
        color: #000;
      }
      .action-btn--secondary:hover {
        background: #f3f3f3;
      }
    </style>
  </head>

    <script>
      // ── 알파벳 → 해시태그 매핑 ──
      const LETTER_TAG = { C:'#자기중심', E:'#관계중심', G:'#내부몰입', D:'#외부확장', V:'#성취지향', H:'#관계지향', P:'#본질', L:'#연결', S:'#안정' };

      // 코드에서 해시태그 4개 추출 (NONE → 빈 배열)
      function codeToTags(code) {
        if (!code || code === 'NONE') return [];
        return [...code].map(c => LETTER_TAG[c]).filter(Boolean);
      }

      // 패턴 모양 설명 자동 생성
      function codeToPattern(code) {
        if (!code || code === 'NONE') return '';
        const pos  = code[0] === 'E' ? '얼굴 외곽' : '얼굴 중앙부';
        const den  = code[1] === 'D' ? '분산된' : '집중된';
        const dir  = code[2] === 'V' ? '수직 방향' : '수평 방향';
        const cnt  = code[3] === 'P' ? '점 1개' : code[3] === 'L' ? '점 2개' : '점 3개 이상';
        return `${pos}에 ${den} ${dir}의 ${cnt}`;
      }

      // ── 유형 데이터 ──
      const TYPE_MAP = {
        CGVP: { name: '흔들림없는 확신으로 정상을 향해 돌진하는 독주자' },
        CGVL: { name: '신뢰하는 사람들과 함께 정상까지 파고드는 신념가' },
        CGVS: { name: '하나에 몰입하면서 전체 판의 흐름을 그리는 전략가' },
        CGHP: { name: '확신을 갖고 내 사람에게 헌신하는 순정파' },
        CGHL: { name: '사람들과 깊이 연결되어 관계를 지키는 헌신가' },
        CGHS: { name: '신뢰와 의리를 지키며 주변까지 아우르는 버팀목' },
        CDVL: { name: '강한 확신과 효율로 여러 목표를 동시에 정복하는 모험가' },
        CDVS: { name: '넓은 시야와 강한 확신으로 판을 짜는 계략가' },
        CDHL: { name: '자신과 주변인을 모두 동시에 골고루 챙기는 마당발' },
        CDHS: { name: '자신의 기준으로 폭넓은 관계를 아우르는 조율자' },
        EDVL: { name: '관계와 효율을 무기로 여러 성취를 동시에 쌓는 야심가' },
        EDVS: { name: '관계 속에서 넓게 판을 짜며 그림을 그리는 기획자' },
        EDHL: { name: '여러 관계를 동시에 살뜰히 챙기는 인싸 네트워커' },
        EDHS: { name: '모두를 아우르며 전체 흐름을 중재하는 타고난 관리자' },
        EGVP: { name: '집요하게 목표를 파고들어 이루는 불굴의 집념가' },
        EGVL: { name: '사람들과의 관계에 깊이 몰입해 함께 목표를 완성하려는 동반자' },
        EGVS: { name: '관계를 발판 삼아 넓은 시야로 성취를 그리는 사업가' },
        EGHP: { name: '관계를 위해 헌신하는 정 많은 외골수' },
        EGHL: { name: '관계 속에서 함께 성장하는 신뢰의 아이콘' },
        EGHS: { name: '하나의 관계에 집중하면서도 모두를 아우르는 사교의 달인' },
        NONE: { name: '타고난 운을 막힘없이 온전히 펼쳐내는 맑은 사람' },
      };

      // 궁별 코멘트
      const PALACE_COMMENT = {
        관록궁: '이마 중앙(관록궁)의 점 — 직업운과 사회적 성취를 나타냅니다.',
        복덕궁: '이마 우측(복덕궁)의 점 — 복과 덕이 쌓이는 위치입니다.',
        상모궁: '관자놀이(상모궁)의 점 — 외모와 첫인상의 운을 상징합니다.',
        처첩궁: '눈꼬리(처첩궁)의 점 — 인연과 애정운을 나타냅니다.',
        남녀궁: '볼 오른쪽(남녀궁)의 점 — 자녀운과 생명력을 의미합니다.',
        질액궁:
          '아래 볼(질액궁)의 점 — 건강과 체력 관리에 주의가 필요한 위치입니다.',
        지각궁: '턱 중앙(지각궁)의 점 — 말년운과 안정적인 토대를 나타냅니다.',
        전택궁:
          '왼쪽 아래 볼(전택궁)의 점 — 부동산운과 거주 환경을 상징합니다.',
        노복궁: '볼 왼쪽(노복궁)의 점 — 아랫사람과의 관계, 인복을 나타냅니다.',
        재백궁: '눈꼬리 왼쪽(재백궁)의 점 — 재물운과 경제적 능력을 의미합니다.',
        형제궁: '왼쪽 관자(형제궁)의 점 — 형제·동료와의 관계를 나타냅니다.',
        천이궁:
          '이마 좌측(천이궁)의 점 — 이동운과 변화에 강한 기질을 상징합니다.',
      };

      // ── 유형 매칭 ──
      function matchType(code) {
        if (!code || code === 'NONE') return 'NONE';
        return TYPE_MAP[code] ? code : 'NONE';
      }

      // ── 초기화 ──
      const savedFace =
        localStorage.getItem('capturedDots') ||
        localStorage.getItem('capturedFace');
      const rawCode = localStorage.getItem('resultType') || 'NONE';
      const dominantPalace = localStorage.getItem('dominantPalace') || '';
      const typeKey = matchType(rawCode);
      const data = TYPE_MAP[typeKey];

      // 사용자 사진
      const photoEl = document.getElementById('userPhoto');
      if (savedFace) photoEl.src = savedFace;

      // 결과 채우기
      document.getElementById('resultCode').textContent =
        rawCode !== 'NONE' ? `유형 코드: ${rawCode}` : '';
      document.getElementById('resultType').textContent = data.name;

      // 패턴 모양 설명
      document.getElementById('resultPattern').textContent = codeToPattern(rawCode);

      // 십이궁
      const palaceCount = JSON.parse(localStorage.getItem('palaceCount') || '{}');
      const palacesEl = document.getElementById('resultPalaces');
      Object.keys(palaceCount).forEach((palace) => {
        const span = document.createElement('span');
        span.className = 'result-palace';
        span.textContent = `${palace} ×${palaceCount[palace]}`;
        palacesEl.appendChild(span);
      });

      // 해시태그 (알파벳 기반)
      const tagsEl = document.getElementById('resultTags');
      codeToTags(rawCode).forEach((tag) => {
        const span = document.createElement('span');
        span.className = 'result-tag';
        span.textContent = tag;
        tagsEl.appendChild(span);
      });

      const chat = document.getElementById('chatMessages');
      function scrollBottom() { chat.scrollTo({ top: chat.scrollHeight, behavior: 'smooth' }); }

      function showBubble(typingId, bubbleId, msgId, delay, cb) {
        setTimeout(() => {
          const msg = document.getElementById(msgId);
          if (msg) { msg.style.display = 'flex'; msg.style.animation = 'msgIn 0.45s ease forwards'; }
          scrollBottom();
          setTimeout(() => {
            document.getElementById(typingId).style.display = 'none';
            document.getElementById(bubbleId).style.display = 'block';
            scrollBottom();
            if (cb) cb();
          }, 1200);
        }, delay);
      }

      // 말풍선 1: 수식어 (1.5초 후)
      showBubble('typingDots1', 'bubble1', null, 1500, () => {
        // 말풍선 2: 패턴 모양
        showBubble('typingDots2', 'bubble2', 'aiMsg2', 800, () => {
          // 말풍선 3: 십이궁 (팔레스가 있을 때만)
          const hasPalaces = Object.keys(palaceCount).length > 0;
          if (hasPalaces) {
            showBubble('typingDots3', 'bubble3', 'aiMsg3', 800, () => {
              showBubble('typingDots4', 'bubble4', 'aiMsg4', 800, () => {
                // 말풍선 5: 궁 코멘트
                setTimeout(() => {
                  const msg5 = document.getElementById('aiMsg5');
                  msg5.style.display = 'flex';
                  msg5.style.animation = 'msgIn 0.45s ease forwards';
                  const comment = dominantPalace && PALACE_COMMENT[dominantPalace]
                    ? PALACE_COMMENT[dominantPalace]
                    : '관상에서 점은 단순한 점이 아니라 기운이 모이는 자리입니다.';
                  document.getElementById('commentBubble').textContent = comment;
                  scrollBottom();
                }, 800);
              });
            });
          } else {
            showBubble('typingDots4', 'bubble4', 'aiMsg4', 800, () => {
              setTimeout(() => {
                const msg5 = document.getElementById('aiMsg5');
                msg5.style.display = 'flex';
                msg5.style.animation = 'msgIn 0.45s ease forwards';
                document.getElementById('commentBubble').textContent = '관상에서 점은 단순한 점이 아니라 기운이 모이는 자리입니다.';
                scrollBottom();
              }, 800);
            });
          }
        });
      });
    </script>

    <script src="scale.js"></script>
    <script src="cursor.js"></script>
    <script src="help.js"></script>
  </body>
</html>
