<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>분석 결과 | DOT SHIFT</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="nav.css" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Pretendard', sans-serif;
        background: #fff;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      .resultPage {
        position: fixed;
        top: 0; left: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        background: #fff;
      }

      /* ── 좌측: 결과 정보 ── */
      .res-left {
        flex: 1;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 100px 100px 80px 120px;
        position: relative;
        overflow: hidden;
      }

      /* 노드맵 SVG 오버레이 (좌측 패널 배경) */
      .res-map-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        opacity: 0;
        transition: opacity 1s 0.8s;
      }
      .res-map-overlay.show { opacity: 1; }

      /* 텍스트는 포인터 이벤트만 살리고 z-index는 오버레이 아래 */
      .res-left > *:not(.res-map-overlay):not(.res-bg-code) { position: relative; z-index: 1; }
      .res-bg-code { z-index: 0; }
      /* SVG 자체는 클릭 통과, 노드 outer만 이벤트 수신 */
      .res-map-overlay { pointer-events: none; }
      .dot-node .outer { pointer-events: all; }

      /* 노드맵 SVG 스타일 */
      .dot-node .outer { fill: transparent; cursor: grab; }
      .dot-node .outer:active { cursor: grabbing; }
      .dot-node .inner { fill: #ea5c3a; opacity: 0.7; pointer-events: none; }
      .dot-line { stroke: #ea5c3a; stroke-width: 1.5; opacity: 0.25; }
      .dot-label {
        font-family: 'Pretendard', sans-serif;
        font-size: 13px;
        fill: #000;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .dot-label.shown { opacity: 1; }
      .dot-fill { fill: #ea5c3a; fill-opacity: 0.05; stroke: none; }

      /* 배경 타입코드 워터마크 */
      .res-bg-code {
        position: absolute;
        bottom: -60px; left: -20px;
        font-size: 340px;
        font-weight: 900;
        color: #000;
        opacity: 0.04;
        letter-spacing: -12px;
        line-height: 1;
        pointer-events: none;
        user-select: none;
      }

      .res-eyebrow {
        font-size: 13px;
        font-weight: 600;
        color: #000;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 24px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s, transform 0.5s;
      }
      .res-eyebrow.show { opacity: 1; transform: translateY(0); }

      .res-type-code {
        font-size: 120px;
        font-weight: 900;
        color: #ea5c3a;
        letter-spacing: -4px;
        line-height: 1;
        margin-bottom: 20px;
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.5s 0.1s, transform 0.5s 0.1s;
      }
      .res-type-code.show { opacity: 1; transform: translateY(0); }

      .res-type-name {
        font-size: 30px;
        font-weight: 400;
        color: #000;
        line-height: 1.5;
        margin-bottom: 40px;
        max-width: 680px;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.5s 0.2s, transform 0.5s 0.2s;
      }
      .res-type-name.show { opacity: 1; transform: translateY(0); }

      .res-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 40px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s 0.35s, transform 0.5s 0.35s;
      }
      .res-tags.show { opacity: 1; transform: translateY(0); }
      .res-tag {
        background: #e9f056;
        border: 1px solid #000;
        border-radius: 100px;
        padding: 10px 24px;
        font-size: 17px;
        font-weight: 700;
        color: #000;
      }

      .res-divider {
        width: 48px;
        height: 2px;
        background: #e0e0e0;
        margin-bottom: 32px;
        opacity: 0;
        transition: opacity 0.5s 0.4s;
      }
      .res-divider.show { opacity: 1; }

      .res-comment {
        font-size: 19px;
        font-weight: 400;
        color: #000;
        line-height: 1.85;
        max-width: 640px;
        margin-bottom: 56px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s 0.45s, transform 0.5s 0.45s;
      }
      .res-comment.show { opacity: 1; transform: translateY(0); }

      .res-actions {
        display: flex;
        gap: 14px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s 0.55s, transform 0.5s 0.55s;
      }
      .res-actions.show { opacity: 1; transform: translateY(0); }
      .res-btn {
        height: 52px;
        padding: 0 32px;
        border-radius: 100px;
        font-family: 'Pretendard', sans-serif;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .res-btn--secondary { background: transparent; border: 1.5px solid #000; color: #000; }
      .res-btn--secondary:hover { background: #f5f5f5; border-color: #000; color: #000; }
      .res-btn--primary { background: #111; border: 1.5px solid #111; color: #fff; }
      .res-btn--primary:hover { background: #333; }

      /* ── 우측: 카드 패널 ── */
      @keyframes cardSlideIn {
        from { transform: translate(120px, -120px) rotate(30deg); opacity: 0; }
        60%  { transform: translate(-8px, 6px)     rotate(-2deg); opacity: 1; }
        to   { transform: translate(0, 0)           rotate(0deg);  opacity: 1; }
      }
      .res-card-panel {
        width: 680px;
        flex-shrink: 0;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        gap: 24px;
      }
      .res-flip-wrap {
        opacity: 0;
        transform: translate(80px, -80px);
      }
      .res-flip-wrap.show {
        animation: cardSlideIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .res-card-eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: #000;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      /* ── 궁 정보 툴팁 ── */
      .palace-tooltip {
        position: fixed;
        z-index: 100;
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 18px 22px;
        box-shadow: 0 8px 40px rgba(0,0,0,0.14);
        width: 240px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(6px) scale(0.97);
        transition: opacity 0.18s, transform 0.18s;
      }
      .palace-tooltip.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .palace-tooltip-name {
        font-size: 16px;
        font-weight: 800;
        color: #ea5c3a;
        margin-bottom: 8px;
      }
      .palace-tooltip-desc {
        font-size: 13px;
        font-weight: 400;
        color: #555;
        line-height: 1.7;
      }
      .palace-tooltip-count {
        margin-top: 10px;
        font-size: 11px;
        font-weight: 600;
        color: #bbb;
        letter-spacing: 1px;
      }

      .res-flip-wrap { perspective: 1600px; }
      .res-flip-card {
        width: 248px;
        height: 676px;
        cursor: grab;
        user-select: none;
      }
      .res-flip-card:active { cursor: grabbing; }
      .res-flip-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
      }
      .res-flip-card.flipped .res-flip-inner { transform: rotateY(180deg); }
      .res-flip-front,
      .res-flip-back {
        position: absolute;
        inset: 0;
        border-radius: 14px;
        border: 1px solid rgba(0,0,0,0.13);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        overflow: hidden;
        box-shadow: 0 20px 70px rgba(0,0,0,0.28), 0 4px 16px rgba(0,0,0,0.1);
      }
      .res-flip-front img,
      .res-flip-back img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
      .res-flip-back { transform: rotateY(180deg); }

      .res-card-hint {
        font-size: 11px;
        color: #000;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* 타이핑 도트 (초기 로딩) */
      .typing-dots { display: flex; gap: 7px; padding: 4px 0; }
      .typing-dots span {
        width: 9px; height: 9px;
        border-radius: 50%;
        background: #ddd;
        animation: dot 1.2s infinite ease-in-out;
      }
      .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
      .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>

    <script>
      const LETTER_TAG = { C:'#자기중심', E:'#관계중심', G:'#내부몰입', D:'#외부확장', V:'#성취지향', H:'#관계지향', P:'#본질', L:'#연결', S:'#안정' };
      function codeToTags(code) { if (!code || code === 'NONE') return []; return [...code].map(c => LETTER_TAG[c]).filter(Boolean); }


      const TYPE_MAP = {
        CGVP:{name:'흔들림없는 확신으로 정상을 향해 돌진하는 독주자'},
        CGVL:{name:'신뢰하는 사람들과 함께 정상까지 파고드는 신념가'},
        CGVS:{name:'하나에 몰입하면서 전체 판의 흐름을 그리는 전략가'},
        CGHP:{name:'확신을 갖고 내 사람에게 헌신하는 순정파'},
        CGHL:{name:'사람들과 깊이 연결되어 관계를 지키는 헌신가'},
        CGHS:{name:'신뢰와 의리를 지키며 주변까지 아우르는 버팀목'},
        CDVL:{name:'강한 확신과 효율로 여러 목표를 동시에 정복하는 모험가'},
        CDVS:{name:'넓은 시야와 강한 확신으로 판을 짜는 계략가'},
        CDHL:{name:'자신과 주변인을 모두 동시에 골고루 챙기는 마당발'},
        CDHS:{name:'자신의 기준으로 폭넓은 관계를 아우르는 조율자'},
        EDVL:{name:'관계와 효율을 무기로 여러 성취를 동시에 쌓는 야심가'},
        EDVS:{name:'관계 속에서 넓게 판을 짜며 그림을 그리는 기획자'},
        EDHL:{name:'여러 관계를 동시에 살뜰히 챙기는 인싸 네트워커'},
        EDHS:{name:'모두를 아우르며 전체 흐름을 중재하는 타고난 관리자'},
        EGVP:{name:'집요하게 목표를 파고들어 이루는 불굴의 집념가'},
        EGVL:{name:'사람들과의 관계에 깊이 몰입해 함께 목표를 완성하려는 동반자'},
        EGVS:{name:'관계를 발판 삼아 넓은 시야로 성취를 그리는 사업가'},
        EGHP:{name:'관계를 위해 헌신하는 정 많은 외골수'},
        EGHL:{name:'관계 속에서 함께 성장하는 신뢰의 아이콘'},
        EGHS:{name:'하나의 관계에 집중하면서도 모두를 아우르는 사교의 달인'},
        NONE:{name:'타고난 운을 막힘없이 온전히 펼쳐내는 맑은 사람'},
      };

      const PALACE_COMMENT = {
        명궁:'미간(명궁)의 점 — 운명과 타고난 기질, 삶의 방향성을 나타냅니다.',
        관록궁:'이마 중앙(관록궁)의 점 — 직업운과 사회적 성취를 나타냅니다.',
        복덕궁:'이마 우측(복덕궁)의 점 — 복과 덕이 쌓이는 위치입니다.',
        상모궁:'관자놀이(상모궁)의 점 — 외모와 첫인상의 운을 상징합니다.',

      (function initPage() {
        const TYPE_CARD_MAP = {
          CGVP:'01', CGVL:'02', CGVS:'03',
          CGHP:'04', CGHL:'05', CGHS:'06',
          CDVL:'07', CDVS:'08', CDHL:'09', CDHS:'10',
          EDVL:'11', EDVS:'12', EDHL:'13', EDHS:'14',
          EGVP:'15', EGVL:'16', EGVS:'17',
          EGHP:'18', EGHL:'19', EGHS:'20',
          NONE:'21',
        };

        const rawCode = localStorage.getItem('resultType') || 'NONE';
        const dominantPalace = localStorage.getItem('dominantPalace') || '';
        const typeKey = TYPE_MAP[rawCode] ? rawCode : 'NONE';
        const data = TYPE_MAP[typeKey];

        // 배경 워터마크
        document.getElementById('resBgCode').textContent = rawCode !== 'NONE' ? rawCode : '';

        // 카드 이미지
        const cardNum = TYPE_CARD_MAP[typeKey] || '21';
        document.getElementById('resCardFront').src = `images/cards/card${cardNum}-front.png`;
        document.getElementById('resCardBack').src  = `images/cards/card${cardNum}-back.png`;

        // 순차 등장
        function show(id, delay) {
          setTimeout(() => { const el = document.getElementById(id); if (el) el.classList.add('show'); }, delay);
        }

        setTimeout(() => {
          const codeEl = document.getElementById('elCode');
          codeEl.innerHTML = '';
          const displayCode = rawCode !== 'NONE' ? rawCode : 'NONE';
          let i = 0;
          const iv = setInterval(() => {
            codeEl.textContent += displayCode[i++];
            if (i >= displayCode.length) clearInterval(iv);
          }, 120);
          codeEl.classList.add('show');

          document.getElementById('elName').textContent = data.name;
          show('elEyebrow', 0);
          show('elName', 500);

          const tagsEl = document.getElementById('elTags');
          codeToTags(rawCode).forEach(tag => {
            const s = document.createElement('span');
            s.className = 'res-tag';
            s.textContent = tag;
            tagsEl.appendChild(s);
          });
          show('elTags', 800);
          show('elDivider', 1000);

          const comment = (dominantPalace && PALACE_COMMENT[dominantPalace])
            ? PALACE_COMMENT[dominantPalace]
            : '관상에서 점은 단순한 점이 아니라 기운이 모이는 자리입니다.';
          document.getElementById('elComment').textContent = comment;
          show('elComment', 1200);
          show('elActions', 1500);
          show('resFlipWrap', 400);
          // 노드맵 오버레이는 buildMap에서 직접 처리
        }, 600);

        // ── 얼굴 노드맵 ─────────────────────────────────────────────
        (function buildMap() {
          const palaceCount = JSON.parse(localStorage.getItem('palaceCount') || '{}');
          const activePalaces = Object.keys(palaceCount);
          const svg = document.getElementById('mapSvg');
          if (!svg) return;

          function svgEl(tag, attrs) {
            const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
            return el;
          }

          // 오버레이 표시
          setTimeout(() => svg.classList.add('show'), 800);

          // 활성 노드 목록
          let nodes = activePalaces.filter(p => PALACE_POS[p])
            .map(p => ({name:p, ...PALACE_POS[p], count: palaceCount[p]||1}));
          if (nodes.length === 0) {
            ['관록궁','남녀궁','처첩궁'].forEach(p => { if (PALACE_POS[p]) nodes.push({name:p, ...PALACE_POS[p], count:1}); });
          }

          // 면 채우기
          const faceLayer = svgEl('g', {});
          svg.appendChild(faceLayer);
          let fillPoly = null;
          if (nodes.length >= 3) {
            fillPoly = svgEl('polygon', {
              class:'dot-fill',
              points: nodes.map(n=>`${n.x},${n.y}`).join(' '),
            });
            faceLayer.appendChild(fillPoly);
          }

          // 연결선
          const lineLayer = svgEl('g', {});
          svg.appendChild(lineLayer);
          const lines = [];
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i+1; j < nodes.length; j++) {
              const len = Math.hypot(nodes[j].x-nodes[i].x, nodes[j].y-nodes[i].y);
              const line = svgEl('line', {
                class:'dot-line',
                x1:nodes[i].x, y1:nodes[i].y,
                x2:nodes[j].x, y2:nodes[j].y,
                'data-a':nodes[i].name, 'data-b':nodes[j].name,
                'stroke-dasharray':len, 'stroke-dashoffset':len,
              });
              lineLayer.appendChild(line);
              lines.push(line);
            }
          }

          // 노드 + 레이블
          const nodeLayer = svgEl('g', {});
          svg.appendChild(nodeLayer);
          const basePos = nodes.map(n => ({x:n.x, y:n.y}));
          const nodeEls = [];

          nodes.forEach((node, idx) => {
            const r = 8 + Math.min((node.count-1)*4, 12);
            const g = svgEl('g', {class:'dot-node', style:'opacity:0'});
            g.appendChild(svgEl('circle', {class:'outer', cx:node.x, cy:node.y, r:r+18}));
            g.appendChild(svgEl('circle', {class:'inner', cx:node.x, cy:node.y, r}));
            nodeLayer.appendChild(g);
            nodeEls.push(g);

            const isRight = node.x > 960;
            const isCenter = Math.abs(node.x-960) < 40;
            const lx = isCenter ? node.x : (isRight ? node.x+r+10 : node.x-r-10);
            const ly = isCenter ? node.y+r+16 : node.y+5;
            const anchor = isCenter ? 'middle' : (isRight ? 'start' : 'end');
            const lbl = svgEl('text', {class:'dot-label', id:`lbl-${node.name}`, x:lx, y:ly, 'text-anchor':anchor});
            lbl.textContent = node.name;
            nodeLayer.appendChild(lbl);
            setTimeout(() => lbl.classList.add('shown'), 1400 + idx*100);

            setTimeout(() => {
              g.style.transition = 'opacity 0.4s ease';
              g.style.opacity = '1';
            }, 900 + idx*120);
          });

          // 선 드로잉
          lines.forEach((line, i) => {
            setTimeout(() => {
              line.style.transition = 'stroke-dashoffset 0.6s ease';
              line.style.strokeDashoffset = '0';
              setTimeout(() => {
                line.removeAttribute('stroke-dasharray');
                line.removeAttribute('stroke-dashoffset');
              }, 700);
            }, 1100 + i*80);
          });

          // 플로팅 + 드래그 스프링
          const floatPhase = nodes.map((_, i) => i * 0.9);
          const drag = nodes.map(() => ({offX:0, offY:0, active:false, clientX0:0, clientY0:0, offX0:0, offY0:0}));

          function getScale() { return Math.min(window.innerWidth/1920, window.innerHeight/1080); }

          const tooltip = document.getElementById('palaceTooltip');
          let tooltipTimer = null;

          function showTooltip(node, clientX, clientY) {
            const s = getScale();
            document.getElementById('ttName').textContent = node.name;
            document.getElementById('ttDesc').textContent = PALACE_COMMENT[node.name] || '';
            document.getElementById('ttCount').textContent = node.count > 1 ? `점 ${node.count}개` : '';

            // 화면 기준 위치 계산 — 노드 왼쪽에 배치, 화면 밖이면 오른쪽
            const TW = 260, TH = 120;
            let tx = clientX - TW - 16;
            let ty = clientY - TH / 2;
            if (tx < 8) tx = clientX + 20;
            if (ty < 8) ty = 8;
            if (ty + TH > window.innerHeight - 8) ty = window.innerHeight - TH - 8;

            tooltip.style.left = tx + 'px';
            tooltip.style.top  = ty + 'px';
            tooltip.classList.add('visible');
          }

          function hideTooltip() {
            tooltip.classList.remove('visible');
          }

          nodeEls.forEach((g, i) => {
            const outerCircle = g.querySelector('.outer');
            let mouseDownX = 0, mouseDownY = 0;

            outerCircle.addEventListener('mousedown', e => {
              e.preventDefault(); e.stopPropagation();
              mouseDownX = e.clientX; mouseDownY = e.clientY;
              drag[i].active = true;
              drag[i].clientX0 = e.clientX; drag[i].clientY0 = e.clientY;
              drag[i].offX0 = drag[i].offX; drag[i].offY0 = drag[i].offY;
              outerCircle.style.cursor = 'grabbing';
            });

            outerCircle.addEventListener('mouseup', e => {
              const dx = Math.abs(e.clientX - mouseDownX);
              const dy = Math.abs(e.clientY - mouseDownY);
              if (dx < 5 && dy < 5) {
                // 클릭으로 판정 → 툴팁 토글
                if (tooltip.classList.contains('visible') &&
                    document.getElementById('ttName').textContent === nodes[i].name) {
                  hideTooltip();
                } else {
                  showTooltip(nodes[i], e.clientX, e.clientY);
                }
              }
            });
            // 터치 지원
            outerCircle.addEventListener('touchstart', e => {
              e.stopPropagation();
              const t = e.touches[0];
              drag[i].active = true;
              drag[i].clientX0 = t.clientX; drag[i].clientY0 = t.clientY;
              drag[i].offX0 = drag[i].offX; drag[i].offY0 = drag[i].offY;
            }, {passive: true});
          });
          window.addEventListener('mousemove', e => {
            const s = getScale();
            drag.forEach(d => {
              if (!d.active) return;
              d.offX = d.offX0 + (e.clientX - d.clientX0) / s;
              d.offY = d.offY0 + (e.clientY - d.clientY0) / s;
            });
          });
          window.addEventListener('mouseup', () => {
            drag.forEach((d, i) => {
              if (d.active) {
                d.active = false;
                nodeEls[i].querySelector('.outer').style.cursor = 'grab';
              }
            });
          });

          // 노드 외부 클릭 시 툴팁 닫기
          document.addEventListener('mousedown', e => {
            if (!e.target.closest('.dot-node') && !e.target.closest('.palace-tooltip')) {
              hideTooltip();
            }
          });
          window.addEventListener('touchmove', e => {
            const s = getScale();
            const t = e.touches[0];
            drag.forEach(d => {
              if (!d.active) return;
              d.offX = d.offX0 + (t.clientX - d.clientX0) / s;
              d.offY = d.offY0 + (t.clientY - d.clientY0) / s;
            });
          }, {passive: true});
          window.addEventListener('touchend', () => {
            drag.forEach(d => { d.active = false; });
          });

          let t = 0;
          function tick() {
            t += 0.008;
            nodes.forEach((node, i) => {
              const d = drag[i];
              if (!d.active) { d.offX *= 0.88; d.offY *= 0.88; }
              const floatX = d.active ? 0 : 2.5 * Math.sin(t * 0.7 + floatPhase[i]);
              const floatY = d.active ? 0 : 3.5 * Math.sin(t * 0.5 + floatPhase[i] * 1.3);
              const PAD = 30;
              const cx = Math.max(PAD, Math.min(1240-PAD, basePos[i].x + floatX + d.offX));
              const cy = Math.max(PAD, Math.min(1080-PAD, basePos[i].y + floatY + d.offY));
              const g = nodeEls[i];
              if (!g) return;
              if (fillPoly && i === nodes.length-1) {
                const pts = nodes.map((_, j) => {
                  const dj = drag[j];
                  const fx = dj.active ? 0 : 2.5 * Math.sin(t * 0.7 + floatPhase[j]);
                  const fy = dj.active ? 0 : 3.5 * Math.sin(t * 0.5 + floatPhase[j] * 1.3);
                  return `${Math.max(30,Math.min(1210,basePos[j].x+fx+dj.offX))},${Math.max(30,Math.min(1050,basePos[j].y+fy+dj.offY))}`;
                });
                fillPoly.setAttribute('points', pts.join(' '));
              }
              g.querySelectorAll('circle').forEach(c => { c.setAttribute('cx', cx); c.setAttribute('cy', cy); });
              lines.forEach(l => {
                if (l.dataset.a === node.name) { l.setAttribute('x1', cx); l.setAttribute('y1', cy); }
                if (l.dataset.b === node.name) { l.setAttribute('x2', cx); l.setAttribute('y2', cy); }
              });
              const lbl = document.getElementById(`lbl-${node.name}`);
              if (lbl) {
                const r = 5 + Math.min((node.count-1)*3, 8);
                const isRight = cx > 960, isCenter = Math.abs(cx-960) < 40;
                lbl.setAttribute('x', Math.max(5, Math.min(1230, isCenter ? cx : (isRight ? cx+r+10 : cx-r-10))));
                lbl.setAttribute('y', Math.max(15, Math.min(1070, isCenter ? cy+r+16 : cy+5)));
                lbl.setAttribute('text-anchor', isCenter ? 'middle' : (isRight ? 'start' : 'end'));
              }
            });
            requestAnimationFrame(tick);
          }
          setTimeout(tick, 1600);
        })();

        // 카드 드래그 플립
        const card = document.getElementById('resCard');
        let startX = 0, dragging = false;
        card.addEventListener('mousedown', e => { startX = e.clientX; dragging = true; });
        window.addEventListener('mousemove', e => {
          if (!dragging) return;
          const dx = e.clientX - startX;
          const inner = card.querySelector('.res-flip-inner');
          const base = card.classList.contains('flipped') ? 180 : 0;
          inner.style.transition = 'none';
          inner.style.transform = `rotateY(${base + dx * 0.35}deg)`;
        });
        window.addEventListener('mouseup', e => {
          if (!dragging) return;
          dragging = false;
          const dx = e.clientX - startX;
          const inner = card.querySelector('.res-flip-inner');
          inner.style.transition = '';
          inner.style.transform = '';
          if (Math.abs(dx) > 50) card.classList.toggle('flipped');
        });
      })();

    </script>

    <script>
      (function () {
        var DESIGN_W = 1920, DESIGN_H = 1080;
        function fitResult() {
          var sw = window.innerWidth / DESIGN_W;
          var sh = window.innerHeight / DESIGN_H;
          var s = Math.min(sw, sh);
          document.querySelectorAll('.page-scale').forEach(function (el) {
            el.style.transformOrigin = 'top left';
            el.style.transform = 'scale(' + s + ')';
          });
          document.querySelectorAll('.bottomNav').forEach(function (el) {
            el.style.transformOrigin = 'bottom left';
            el.style.transform = 'scale(' + sw + ')';
          });
        }
        fitResult();
        window.addEventListener('resize', fitResult);
      })();
    </script>
    <script src="cursor.js" defer></script>
    <script src="help.js" defer></script>
    <script src="sound.js" defer></script>
  </body>
</html>
