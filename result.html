      // 도움말 슬라이드 캡처(#capture=1)일 때만: 예시 결과(EDVS, 복덕궁)로 화면을 채움 — Figma 2132:1911
      if (/capture=/.test(location.hash)) {
        localStorage.setItem('resultType', 'EDVS');

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Pretendard', sans-serif;
        background: #fff;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      .resultPage {
        position: fixed;
        top: 0; left: 0;
        width: 1920px;
        height: 1080px;
        display: flex;
        background: #fff;
      }

      /* ── 좌측: 결과 정보 ── */
      .res-left {
        flex: 1;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 100px 100px 80px 120px;
        position: relative;
        overflow: hidden;
      }

      /* 노드맵 SVG 오버레이 (좌측 패널 배경) */
      .res-map-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        opacity: 0;
        transition: opacity 1s 0.8s;
      }
      .res-map-overlay.show { opacity: 1; }

      /* 텍스트는 포인터 이벤트만 살리고 z-index는 오버레이 아래 */
      .res-left > *:not(.res-map-overlay):not(.res-bg-code) { position: relative; z-index: 1; }
      .res-bg-code { z-index: 0; }
      /* SVG 자체는 클릭 통과, 노드 outer만 이벤트 수신 */
      .res-map-overlay { pointer-events: none; }
      .dot-node .outer { pointer-events: all; }

      /* 노드맵 SVG 스타일 */
      .dot-node .outer { fill: transparent; cursor: grab; }
      .dot-node .outer:active { cursor: grabbing; }
      /* 글로우 없음. 호버하면 점이 커짐 (반지름은 tick() 에서 부드럽게 변경) */
      .dot-node .inner { fill: #ea5c3a; opacity: 0.7; pointer-events: none; transition: opacity 0.2s; }
      .dot-node.hover .inner { opacity: 1; }
      .dot-line { stroke: #ea5c3a; stroke-width: 1.5; opacity: 0.25; }
      .dot-label {
        font-family: 'Pretendard', sans-serif;
        font-size: 13px;
        fill: #000;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .dot-label.shown { opacity: 1; }
      .dot-fill { fill: #ea5c3a; fill-opacity: 0.05; stroke: none; }

      /* 배경 타입코드 워터마크 */
      .res-bg-code {
        position: absolute;
        bottom: -60px; left: -20px;
        font-size: 340px;
        font-weight: 900;
        color: #000;
        opacity: 0.04;
        letter-spacing: -12px;
        line-height: 1;
        pointer-events: none;
        user-select: none;
      }

      .res-eyebrow {
        font-size: 13px;
        font-weight: 600;
        color: #000;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 8px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s, transform 0.5s;
      }
      .res-eyebrow.show { opacity: 1; transform: translateY(0); }

      .res-type-code {
        font-size: 120px;
        font-weight: 900;
        color: #ea5c3a;
        letter-spacing: -4px;
        line-height: 1;
        margin-bottom: 20px;
        opacity: 0;
        transform: translateY(16px);
        transition: opacity 0.5s 0.1s, transform 0.5s 0.1s;
      }
      .res-type-code.show { opacity: 1; transform: translateY(0); }

      .res-type-name {
        font-size: 30px;
        font-weight: 400;
        color: #000;
        line-height: 1.5;
        margin-bottom: 40px;
        max-width: 680px;
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.5s 0.2s, transform 0.5s 0.2s;
      }
      .res-type-name.show { opacity: 1; transform: translateY(0); }

      .res-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 40px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s 0.35s, transform 0.5s 0.35s;
      }
      .res-tags.show { opacity: 1; transform: translateY(0); }
      .res-tag {
        background: #e9f056;
        border: 1px solid #000;
        border-radius: 100px;
        padding: 10px 24px;
        font-size: 17px;
        font-weight: 700;
        color: #000;
      }

      .res-divider {
        width: 48px;
        height: 2px;
        background: #e0e0e0;
        margin-bottom: 32px;
        opacity: 0;
        transition: opacity 0.5s 0.4s;
      }
      .res-divider.show { opacity: 1; }

      .res-comment {
        font-size: 19px;
        font-weight: 400;
        color: #000;
        line-height: 1.85;
        max-width: 640px;
        margin-bottom: 56px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s 0.45s, transform 0.5s 0.45s;
      }
      .res-comment.show { opacity: 1; transform: translateY(0); }

      .res-actions {
        display: flex;
        gap: 14px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.5s 0.55s, transform 0.5s 0.55s;
      }
      .res-actions.show { opacity: 1; transform: translateY(0); }
      .res-btn {
        height: 52px;
        padding: 0 32px;
        border-radius: 100px;
        font-family: 'Pretendard', sans-serif;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
      }
      .res-btn--secondary { background: transparent; border: 1.5px solid #000; color: #000; }
      .res-btn--secondary:hover { background: #f5f5f5; border-color: #000; color: #000; }
      .res-btn--primary { background: #111; border: 1.5px solid #111; color: #fff; }
      .res-btn--primary:hover { background: #333; }

      /* ── 우측: 카드 패널 ── */
      @keyframes cardSlideIn {
        from { transform: translate(120px, -120px) rotate(30deg); opacity: 0; }
        60%  { transform: translate(-8px, 6px)     rotate(-2deg); opacity: 1; }
        to   { transform: translate(0, 0)           rotate(0deg);  opacity: 1; }
      }
      .res-card-panel {
        width: 680px;
        flex-shrink: 0;
        height: 1080px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fff;
        gap: 24px;
      }
      .res-flip-wrap {
        opacity: 0;
        transform: translate(80px, -80px);
      }
      .res-flip-wrap.show {
        animation: cardSlideIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      /* 도움말 캡처(#capture) 중에는 애니메이션이 꺼지므로 카드는 도착한 상태로 */
      .htour-capture .res-flip-wrap.show { opacity: 1; transform: none; }

      .res-card-eyebrow {
        font-size: 11px;
        font-weight: 600;
        color: #000;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      /* ── 궁 정보 툴팁 ── */
      .palace-tooltip {
        position: fixed;
        z-index: 100;
        background: #fff;
        border: 1px solid #000;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        width: fit-content;
        min-width: 160px;
        max-width: 220px;
        pointer-events: none;
        opacity: 0;
        transform: translateY(6px) scale(0.97);
        transition: opacity 0.18s, transform 0.18s;
        overflow: hidden;
      }
      .palace-tooltip.visible {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      .palace-tooltip-name {
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        background: #ea5c3a;
        padding: 5px 22px;
        margin: 0;
      }
      .palace-tooltip-body {
        padding: 14px 22px;
      }
      .palace-tooltip-desc {
        font-size: 13px;
        font-weight: 400;
        color: #555;
        line-height: 1.7;
      }
      .palace-tooltip-count {
        margin-top: 10px;
        font-size: 11px;
        font-weight: 600;
        color: #bbb;
        letter-spacing: 1px;
      }

      .res-flip-wrap { perspective: 1600px; }
      .res-flip-card {
        width: 248px;
        height: 676px;
        cursor: grab;
        user-select: none;
      }
      .res-flip-card:active { cursor: grabbing; }
      .res-flip-inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform;
      }
      .res-flip-card.flipped .res-flip-inner { transform: rotateY(180deg); }
      .res-flip-front,
      .res-flip-back {
        position: absolute;
        inset: 0;
        border-radius: 0;
        border: 1px solid #000;  /* 그림자 대신 1px 테두리 */
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        overflow: hidden;
      }
      .res-flip-front img,
      .res-flip-back img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
      .res-flip-back { transform: rotateY(180deg); }

      .res-card-hint {
        font-size: 18px;
        font-weight: 600;
        color: #000;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* 타이핑 도트 (초기 로딩) */
      .typing-dots { display: flex; gap: 7px; padding: 4px 0; }
      .typing-dots span {
        width: 9px; height: 9px;
        border-radius: 50%;
        background: #ddd;
        animation: dot 1.2s infinite ease-in-out;
      }
      .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
      .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dot {
        0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>

    <script>
      const LETTER_TAG = { C:'#자기중심', E:'#관계중심', G:'#내부몰입', D:'#외부확장', V:'#성취지향', H:'#관계지향', P:'#본질', L:'#연결', S:'#안정' };
      function codeToTags(code) { if (!code || code === 'NONE') return []; return [...code].map(c => LETTER_TAG[c]).filter(Boolean); }


      const TYPE_MAP = {
        CGVP:{name:'흔들림없는 확신으로 정상을 향해 돌진하는 독주자'},

        재백궁:'<strong>눈꼬리 왼쪽(재백궁)의 점</strong><br>재물운과 경제적 능력을 의미합니다.',
        형제궁:'<strong>왼쪽 관자(형제궁)의 점</strong><br>형제·동료와의 관계를 나타냅니다.',
        천이궁:'<strong>이마 좌측(천이궁)의 점</strong><br>이동운과 변화에 강한 기질을 상징합니다.',
      };

      /* 십이궁 좌표 — 텍스트 우측(x>740) 영역에만 배치 */
      const PALACE_POS = {
        관록궁: {x:960, y:175},
        천이궁: {x:830, y:215},
        복덕궁: {x:1090, y:215},
        형제궁: {x:750, y:360},
        상모궁: {x:1170, y:360},
        명궁:   {x:960, y:400},
        재백궁: {x:790, y:490},
        처첩궁: {x:1130, y:490},
        노복궁: {x:770, y:640},
        남녀궁: {x:1150, y:640},
        전택궁: {x:830, y:790},
        질액궁: {x:1090, y:790},
        지각궁: {x:960, y:880},
      };

      (function initPage() {
        const TYPE_CARD_MAP = {
          CGVP:'01', CGVL:'02', CGVS:'03',
          CGHP:'04', CGHL:'05', CGHS:'06',
          CDVL:'07', CDVS:'08', CDHL:'09', CDHS:'10',
          EDVL:'11', EDVS:'12', EDHL:'13', EDHS:'14',
          EGVP:'15', EGVL:'16', EGVS:'17',
          EGHP:'18', EGHL:'19', EGHS:'20',
          NONE:'21',
        };

        const rawCode = localStorage.getItem('resultType') || 'NONE';
        // NONE 이면 이전 분석의 대표 궁이 남아 있어도 쓰지 않음
        const dominantPalace = (localStorage.getItem('resultType') || 'NONE') === 'NONE'
          ? '' : (localStorage.getItem('dominantPalace') || '');
        const typeKey = TYPE_MAP[rawCode] ? rawCode : 'NONE';
        const data = TYPE_MAP[typeKey];

        // 배경 워터마크
        document.getElementById('resBgCode').textContent = rawCode !== 'NONE' ? rawCode : '';

        // 카드 이미지
        const cardNum = TYPE_CARD_MAP[typeKey] || '21';
        document.getElementById('resCardFront').src = `images/cards/card${cardNum}-front.png`;
        document.getElementById('resCardBack').src  = `images/cards/card${cardNum}-back.png`;

        // 순차 등장
        function show(id, delay) {
          setTimeout(() => { const el = document.getElementById(id); if (el) el.classList.add('show'); }, delay);
        }

        setTimeout(() => {
          const codeEl = document.getElementById('elCode');
          codeEl.innerHTML = '';
          const displayCode = rawCode !== 'NONE' ? rawCode : 'NONE';
          let i = 0;
          const iv = setInterval(() => {
            codeEl.textContent += displayCode[i++];
            if (i >= displayCode.length) clearInterval(iv);
          }, 120);
          codeEl.classList.add('show');

          document.getElementById('elName').textContent = data.name;
          show('elEyebrow', 0);
          show('elName', 500);

          const tagsEl = document.getElementById('elTags');
          codeToTags(rawCode).forEach(tag => {
            const s = document.createElement('span');
            s.className = 'res-tag';
            s.textContent = tag;
            tagsEl.appendChild(s);
          });
          show('elTags', 800);
          show('elDivider', 1000);

          const comment = (dominantPalace && PALACE_COMMENT[dominantPalace])
            ? PALACE_COMMENT[dominantPalace]
            : '관상에서 점은 단순한 점이 아니라 기운이 모이는 자리입니다.';
          // PALACE_COMMENT 는 코드에 적힌 고정 문구 (<strong>, <br> 포함) → HTML 로 표시
          document.getElementById('elComment').innerHTML = comment;
          show('elComment', 1200);
          show('elActions', 1500);
          show('resFlipWrap', 400);
          // 노드맵 오버레이는 buildMap에서 직접 처리
        }, 600);

        // ── 얼굴 노드맵 ─────────────────────────────────────────────
        (function buildMap() {
          if (typeKey === 'NONE') return;  // NONE 유형은 노드맵 없음 (이전 분석 값이 남아 있어도)
          const palaceCount = JSON.parse(localStorage.getItem('palaceCount') || '{}');
          const activePalaces = Object.keys(palaceCount);
          const svg = document.getElementById('mapSvg');
          if (!svg) return;

          function svgEl(tag, attrs) {
            const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
            Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k,v));
            return el;
          }

          // 오버레이 표시
          setTimeout(() => svg.classList.add('show'), 800);

          // 활성 노드 목록
          let nodes = activePalaces.filter(p => PALACE_POS[p])
            .map(p => ({name:p, ...PALACE_POS[p], count: palaceCount[p]||1}));
          // 찍은 점이 없으면(NONE) 노드맵을 그리지 않음 (예전에는 예시 노드 3개를 대신 보여줬음)
          if (nodes.length === 0) return;

          // 면 채우기
          const faceLayer = svgEl('g', {});
          svg.appendChild(faceLayer);
          let fillPoly = null;
          if (nodes.length >= 3) {
            fillPoly = svgEl('polygon', {
              class:'dot-fill',
              points: nodes.map(n=>`${n.x},${n.y}`).join(' '),
            });
            faceLayer.appendChild(fillPoly);
          }

          // 연결선
          const lineLayer = svgEl('g', {});
          svg.appendChild(lineLayer);
          const lines = [];
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i+1; j < nodes.length; j++) {
              const len = Math.hypot(nodes[j].x-nodes[i].x, nodes[j].y-nodes[i].y);
              const line = svgEl('line', {
                class:'dot-line',
                x1:nodes[i].x, y1:nodes[i].y,
                x2:nodes[j].x, y2:nodes[j].y,
                'data-a':nodes[i].name, 'data-b':nodes[j].name,
                'stroke-dasharray':len, 'stroke-dashoffset':len,
              });
              lineLayer.appendChild(line);
              lines.push(line);
            }
          }

          // 노드 + 레이블
          const nodeLayer = svgEl('g', {});
          svg.appendChild(nodeLayer);
          const basePos = nodes.map(n => ({x:n.x, y:n.y}));
          const nodeEls = [];

          nodes.forEach((node, idx) => {
            const r = 8 + Math.min((node.count-1)*4, 12);
            const g = svgEl('g', {class:'dot-node', style:'opacity:0'});
            g.appendChild(svgEl('circle', {class:'outer', cx:node.x, cy:node.y, r:r+18}));
            g.appendChild(svgEl('circle', {class:'inner', cx:node.x, cy:node.y, r}));
            node.r = r;
            nodeLayer.appendChild(g);
            nodeEls.push(g);

            const isRight = node.x > 960;
            const isCenter = Math.abs(node.x-960) < 40;
            const lx = isCenter ? node.x : (isRight ? node.x+r+10 : node.x-r-10);
            const ly = isCenter ? node.y+r+16 : node.y+5;
            const anchor = isCenter ? 'middle' : (isRight ? 'start' : 'end');
            const lbl = svgEl('text', {class:'dot-label', id:`lbl-${node.name}`, x:lx, y:ly, 'text-anchor':anchor});
            lbl.textContent = node.name;
            nodeLayer.appendChild(lbl);
            setTimeout(() => lbl.classList.add('shown'), 1400 + idx*100);

            setTimeout(() => {
              g.style.transition = 'opacity 0.4s ease';
              g.style.opacity = '1';
            }, 900 + idx*120);
          });

          // 선 드로잉
          lines.forEach((line, i) => {
            setTimeout(() => {
              line.style.transition = 'stroke-dashoffset 0.6s ease';
              line.style.strokeDashoffset = '0';
              setTimeout(() => {
                line.removeAttribute('stroke-dasharray');
                line.removeAttribute('stroke-dashoffset');
              }, 700);
            }, 1100 + i*80);
          });

          // 플로팅 + 드래그 스프링
          const floatPhase = nodes.map((_, i) => i * 0.9);
          const drag = nodes.map(() => ({offX:0, offY:0, active:false, clientX0:0, clientY0:0, offX0:0, offY0:0}));

          function getScale() { return Math.min(window.innerWidth/1920, window.innerHeight/1080); }

          const tooltip = document.getElementById('palaceTooltip');
          let tooltipTimer = null;

          function showTooltip(node, clientX, clientY) {
            const s = getScale();
            document.getElementById('ttName').textContent = node.name;
            document.getElementById('ttDesc').innerHTML = PALACE_COMMENT[node.name] || '';
            document.getElementById('ttCount').textContent = node.count > 1 ? `점 ${node.count}개` : '';

            // 화면 기준 위치 계산 — 노드 왼쪽에 배치, 화면 밖이면 오른쪽
            const TW = 260, TH = 120;
            let tx = clientX - TW - 16;
            let ty = clientY - TH / 2;
            if (tx < 8) tx = clientX + 20;
            if (ty < 8) ty = 8;
            if (ty + TH > window.innerHeight - 8) ty = window.innerHeight - TH - 8;

            tooltip.style.left = tx + 'px';
            tooltip.style.top  = ty + 'px';
            tooltip.classList.add('visible');
          }

          function hideTooltip() {
            tooltip.classList.remove('visible');
          }

          nodeEls.forEach((g, i) => {
            const outerCircle = g.querySelector('.outer');
            let mouseDownX = 0, mouseDownY = 0;

            outerCircle.addEventListener('mousedown', e => {
              e.preventDefault(); e.stopPropagation();
              mouseDownX = e.clientX; mouseDownY = e.clientY;
              drag[i].active = true;
              drag[i].clientX0 = e.clientX; drag[i].clientY0 = e.clientY;
              drag[i].offX0 = drag[i].offX; drag[i].offY0 = drag[i].offY;
              outerCircle.style.cursor = 'grabbing';
            });

            outerCircle.addEventListener('mouseup', e => {
              const dx = Math.abs(e.clientX - mouseDownX);
              const dy = Math.abs(e.clientY - mouseDownY);
              if (dx < 5 && dy < 5) {
                // 클릭으로 판정 → 툴팁 토글
                if (tooltip.classList.contains('visible') &&
                    document.getElementById('ttName').textContent === nodes[i].name) {
                  hideTooltip();
                } else {
                  showTooltip(nodes[i], e.clientX, e.clientY);
                }
              }
            });
            // 터치 지원
            outerCircle.addEventListener('touchstart', e => {
              e.stopPropagation();
              const t = e.touches[0];
              drag[i].active = true;
              drag[i].clientX0 = t.clientX; drag[i].clientY0 = t.clientY;
              drag[i].offX0 = drag[i].offX; drag[i].offY0 = drag[i].offY;
            }, {passive: true});
          });
          window.addEventListener('mousemove', e => {
            const s = getScale();
            drag.forEach(d => {
              if (!d.active) return;
              d.offX = d.offX0 + (e.clientX - d.clientX0) / s;
              d.offY = d.offY0 + (e.clientY - d.clientY0) / s;
            });
          });
          window.addEventListener('mouseup', () => {
            drag.forEach((d, i) => {
              if (d.active) {
                d.active = false;
                nodeEls[i].querySelector('.outer').style.cursor = 'grab';
              }
            });
          });

          // 노드 외부 클릭 시 툴팁 닫기
          document.addEventListener('mousedown', e => {
            if (!e.target.closest('.dot-node') && !e.target.closest('.palace-tooltip')) {
              hideTooltip();
            }
          });
          window.addEventListener('touchmove', e => {
            const s = getScale();
            const t = e.touches[0];
            drag.forEach(d => {
              if (!d.active) return;
              d.offX = d.offX0 + (t.clientX - d.clientX0) / s;
              d.offY = d.offY0 + (t.clientY - d.clientY0) / s;
            });
          }, {passive: true});
          window.addEventListener('touchend', () => {
            drag.forEach(d => { d.active = false; });
          });

          let t = 0;
          /* ── 3D 원근 (튕김 없는 부드러운 보간) ──
             호버한 점은 화면 쪽(z)으로 부드럽게 다가와 원근 때문에 커 보이고(FOCAL/(FOCAL-z)),
             이어진 다른 점은 원근 단축만큼 그 점 쪽으로 당겨짐:
             화면상 거리 = √(선 길이² − 깊이 차²). 호버한 점 자체는 제자리. */
          const FOCAL = 400;          // 초점 거리 (클수록 원근 약함)
          const HOVER_Z = 220;        // 호버 시 다가오는 깊이 → 크기 FOCAL/(FOCAL-HOVER_Z) ≈ 2.2배
          const EASE = 0.1;           // 다가가는 속도 (0~1, 넘치지 않음)
          const MIN_GAP = 24;         // 당겨져도 두 점 가장자리 사이에 남길 최소 간격
          const nodeIndex = Object.fromEntries(nodes.map((n, i) => [n.name, i]));
          const edges = lines.map(l => ({ l, a: nodeIndex[l.dataset.a], b: nodeIndex[l.dataset.b] }));
          const depth = nodes.map(() => ({ z: 0, target: 0 }));
          nodeEls.forEach((g, i) => {
            const outer = g.querySelector('.outer');
            outer.addEventListener('mouseenter', () => { depth[i].target = HOVER_Z; g.classList.add('hover'); });
            outer.addEventListener('mouseleave', () => { depth[i].target = 0; g.classList.remove('hover'); });
          });

          function tick() {
            t += 0.008;
            const PAD = 30;
            depth.forEach(d => { d.z += (d.target - d.z) * EASE; });

            // 기준 위치 (둥둥 + 드래그)
            const base = nodes.map((node, i) => {
              const d = drag[i];
              if (!d.active) { d.offX *= 0.88; d.offY *= 0.88; }
              const floatX = d.active ? 0 : 2.5 * Math.sin(t * 0.7 + floatPhase[i]);
              const floatY = d.active ? 0 : 3.5 * Math.sin(t * 0.5 + floatPhase[i] * 1.3);
              return { x: basePos[i].x + floatX + d.offX, y: basePos[i].y + floatY + d.offY };
            });

            // 원근 단축: 더 앞에 있는 점과 이어진 점을 그 점 쪽으로 당김
            const shift = nodes.map(() => ({ x: 0, y: 0 }));
            edges.forEach(e => {
              const dz = depth[e.b].z - depth[e.a].z;
              if (Math.abs(dz) < 0.5) return;
              const [back, front] = dz > 0 ? [e.a, e.b] : [e.b, e.a];
              if (drag[back].active) return;
              const dx = base[front].x - base[back].x, dy = base[front].y - base[back].y;
              const L = Math.hypot(dx, dy) || 1;
              // 가까운 점끼리 겹치지 않게: 두 점 반지름 합 + 여백만큼은 항상 남김
              const rFront = nodes[front].r * FOCAL / (FOCAL - depth[front].z);
              const rBack = nodes[back].r * FOCAL / (FOCAL - depth[back].z);
              const minDist = rFront + rBack + MIN_GAP;
              const pull = Math.min(L - Math.sqrt(Math.max(L * L - dz * dz, 0)), Math.max(0, L - minDist));
              shift[back].x += dx / L * pull;
              shift[back].y += dy / L * pull;
            });

            // 화면에 그리기: 위치는 xy, 크기·진하기는 원근
            const pos = nodes.map((node, i) => {
              const cx = Math.max(PAD, Math.min(1240 - PAD, base[i].x + shift[i].x));
              const cy = Math.max(PAD, Math.min(1080 - PAD, base[i].y + shift[i].y));
              const s = FOCAL / (FOCAL - depth[i].z);
              return { x: cx, y: cy, r: node.r * s, s };
            });

            if (fillPoly) fillPoly.setAttribute('points', pos.map(q => `${q.x},${q.y}`).join(' '));

            nodes.forEach((node, i) => {
              const g = nodeEls[i];
              if (!g) return;
              const { x: cx, y: cy, r: rNow, s } = pos[i];
              g.querySelectorAll('circle').forEach(c => { c.setAttribute('cx', cx); c.setAttribute('cy', cy); });
              g.querySelector('.inner').setAttribute('r', rNow);
              g.querySelector('.outer').setAttribute('r', rNow + 18);
              g.querySelector('.inner').style.opacity = Math.min(1, 0.55 + 0.3 * s);
              const lbl = document.getElementById(`lbl-${node.name}`);
              if (lbl) {
                const isRight = cx > 960, isCenter = Math.abs(cx - 960) < 40;
                lbl.setAttribute('x', Math.max(5, Math.min(1230, isCenter ? cx : (isRight ? cx + rNow + 10 : cx - rNow - 10))));
                lbl.setAttribute('y', Math.max(15, Math.min(1070, isCenter ? cy + rNow + 16 : cy + 5)));
                lbl.setAttribute('text-anchor', isCenter ? 'middle' : (isRight ? 'start' : 'end'));
              }
            });

            // 선: 두 점의 가장자리끼리 (선 굵기도 원근에 맞춰)
            edges.forEach(e => {
              const a = pos[e.a], b = pos[e.b];
              const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
              const ux = dx / len, uy = dy / len;
              const ra = Math.min(a.r, len / 2), rb = Math.min(b.r, len / 2);
              e.l.setAttribute('x1', a.x + ux * ra); e.l.setAttribute('y1', a.y + uy * ra);
              e.l.setAttribute('x2', b.x - ux * rb); e.l.setAttribute('y2', b.y - uy * rb);
              e.l.style.strokeWidth = 1.5 * (a.s + b.s) / 2;
            });
            requestAnimationFrame(tick);
          }
          setTimeout(tick, 1600);
        })();

        // 카드 드래그 플립
        const card = document.getElementById('resCard');
        let startX = 0, dragging = false;
        card.addEventListener('mousedown', e => { startX = e.clientX; dragging = true; });
        window.addEventListener('mousemove', e => {
          if (!dragging) return;
          const dx = e.clientX - startX;
          const inner = card.querySelector('.res-flip-inner');
          const base = card.classList.contains('flipped') ? 180 : 0;
          inner.style.transition = 'none';
          inner.style.transform = `rotateY(${base + dx * 0.35}deg)`;
        });
        window.addEventListener('mouseup', e => {
          if (!dragging) return;
          dragging = false;
          const dx = e.clientX - startX;
          const inner = card.querySelector('.res-flip-inner');
          inner.style.transition = '';
          inner.style.transform = '';
          if (Math.abs(dx) > 50) card.classList.toggle('flipped');
        });
      })();

    </script>

    <!-- 1920×1080 결과 화면을 창 안에 맞춰 가운데 배치 (노드맵 JS 의 getScale() 과 같은 배율) -->
    <script src="fit-stage.js"></script>
    <!-- 블러 도움말 (보관용): 도움말 슬라이드 이미지 캡처할 때만 — result.html#capture=1 (images/help/slides/README.md) -->
    <script src="help-tour.js"></script>
    <script>
      if (window.helpTourCapture) {
        // 유형 코드가 다 타이핑된 뒤 재야 선명한 구간 폭이 맞음
        setTimeout(() => startHelpTour([
          {
            // TYPE. / 유형 코드 / 유형 이름만 선명 (Figma 검정 네모)
            text: '점 패턴을 통해 나는 어떤 유형인가를 알아보세요.',
            // 요소는 가로로 꽉 찬 블록이라 글자가 차지하는 폭만큼만 (여백 12)
            hole: () => {
              const rs = ['elEyebrow', 'elCode', 'elName'].map(id => {
                const range = document.createRange();
                range.selectNodeContents(document.getElementById(id));
                return range.getBoundingClientRect();
              });
              const P = 12;
              return {
                left: Math.min(...rs.map(r => r.left)) - P, top: Math.min(...rs.map(r => r.top)) - P,
                right: Math.max(...rs.map(r => r.right)) + P, bottom: Math.max(...rs.map(r => r.bottom)) + P,
              };
            },
          },
        ]), 1500);
      }
    </script>
    <script src="cursor.js" defer></script>
    <script src="help.js" defer></script>
    <script src="sound.js" defer></script>
  </body>
