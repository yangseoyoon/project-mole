<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>분석 중 | DOT SHIFT</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="nav.css" />
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        background: #fff;
      }

      /* 점 · 문구 · 얼굴을 화면 가운데에 세로로 (Figma: y 268.7 ~ 807.4, 중심 ≈ 540) */
      .loadingPage {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: var(--nav-top-h) 0 var(--nav-bottom-h);
        background: #fff;
      }

      /* 점 세 개 애니메이션 */
      .loading-dots {
        display: flex;
        gap: calc(10 * var(--u));
        align-items: center;
      }
      .loading-dots span {
        display: block;
        width: calc(10 * var(--u));
        height: calc(10 * var(--u));
        background: #000;
        border-radius: 50%;
        animation: dotBlink 1.2s ease-in-out infinite;
      }
      .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
      .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes dotBlink {
        0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
        40%            { opacity: 1;   transform: scale(1.2); }
      }

      /* 메인 텍스트 (Figma: 가운데에서 오른쪽으로 9.65 치우침) */
      .loading-text {
        margin-top: calc(57.9 * var(--u));
        margin-left: calc(19.3 * var(--u));
        font-family: 'Pretendard', sans-serif;
        font-weight: 700;
        font-size: calc(36 * var(--u));
        color: #000;
        white-space: nowrap;
        line-height: 1.3;
        animation: fadeInUpText 0.6s ease forwards;
      }
      @keyframes fadeInUpText {
        from { opacity: 0; transform: translateY(calc(30 * var(--u))); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* 얼굴 이미지 */
      .loading-face {
        margin-top: calc(110.6 * var(--u));
        width: calc(235 * var(--u));
        height: calc(313.437 * var(--u));
        object-fit: cover;
      }

    </style>
  </head>
  <body class="rwd">

      <img class="loading-face" id="loadingFace" src="images/loading/face-01.webp" alt="" />

    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="bottomNav">

        <img class="bn-logo-l" style="width:29.935px;height:29.935px;left:66.65px;top:22.59px" src="images/nav/logo-O.svg" alt="">
        <img class="bn-logo-l" style="width:22.571px;height:29.129px;left:98.09px;top:22.99px" src="images/nav/logo-T.svg" alt="">
        <img class="bn-logo-l" style="width:21.726px;height:30.015px;left:134.06px;top:22.59px" src="images/nav/logo-S.svg" alt="">
        <img class="bn-logo-l" style="width:23.336px;height:29.129px;left:160.53px;top:22.99px" src="images/nav/logo-H.svg" alt="">
        <img class="bn-logo-l" style="width:4.426px;height:29.129px;left:189.82px;top:22.99px" src="images/nav/logo-I.svg" alt="">
        <img class="bn-logo-l" style="width:18.065px;height:29.129px;left:200.16px;top:22.99px" src="images/nav/logo-F.svg" alt="">
        <img class="bn-logo-l" style="width:22.571px;height:29.129px;left:221.73px;top:22.99px" src="images/nav/logo-T.svg" alt="">
        <a class="bn-badge bn-badge--h" href="index.html">H</a>
        <button class="bn-badge bn-badge--b" onclick="history.back()">B</button>
        <button class="bn-item" style="left:450px" onclick="window.location.href='index.html'">

    <script>
      (function() {
        const images = [
          'images/loading/face-01.webp',
          'images/loading/face-02.webp',
          'images/loading/face-03.webp',
          'images/loading/face-04.webp',
          'images/loading/face-05.webp',
          'images/loading/face-06.webp',
          'images/loading/face-07.webp',
          'images/loading/face-08.webp',
          'images/loading/face-09.webp',
          'images/loading/face-10.webp',
          'images/loading/face-11.webp',
          'images/loading/face-12.webp',
          'images/loading/face-13.webp',
          'images/loading/face-14.webp',
          'images/loading/face-15.webp',
          'images/loading/face-16.webp',
          'images/loading/face-17.webp',
          'images/loading/face-18.webp',
          'images/loading/face-19.webp',
          'images/loading/face-20.webp',
          'images/loading/face-21.webp',
        ];
        const el = document.getElementById('loadingFace');
        let idx = 0;
        const INTERVAL = 150; // 한 장당 표시 시간(ms) — 21장이 4초 안에 다 나오게
        const TOTAL = 4000;

        // 미리 받아두고, 다 받아진 사진만 보여줌 (사진이 커서 받는 중인 사진은 건너뜀)
        const loaded = images.map(src => { const im = new Image(); im.src = src; return im; });
        const ready = (im) => im.complete && im.naturalWidth > 0;

        // 바꿀 때 투명하게 했다 켜면 200ms 간격에선 계속 흐려져 안 보이므로 바로 바꿈
        const timer = setInterval(() => {
          for (let k = 1; k <= images.length; k++) {
            const next = (idx + k) % images.length;
            if (ready(loaded[next])) { idx = next; el.src = images[idx]; break; }
          }
        }, INTERVAL);

        setTimeout(() => {
          clearInterval(timer);
          window.location.href = 'result.html';
        }, TOTAL);
      })();
    </script>

    <script src="cursor.js" defer></script>
    <script src="help.js" defer></script>
  <script src="sound.js" defer></script>
