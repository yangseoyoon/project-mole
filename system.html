    <style>
      /* 도움말 동안 얼굴 사진 자리에 보여줄 예시 사진 (흰 배경) */
      .help-sample-face {
        position: absolute;
        inset: 0;
        z-index: 1;   /* 사진(savedCanvas) 위, 점(dotCanvas z2)·그리드 아래 */
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 18%;
        transform: scale(1.716);       /* 1.3 → ×1.2 → ×1.1 확대 (얼굴 위쪽 기준) */
        transform-origin: center 18%;
        background: #fff;
        pointer-events: none;
      }
    </style>

      <a class="navLeft" href="index.html">PROJECT: DOT SHIFT</a>

      <div class="sys-deco" style="--r:53; --b:91"></div>
      <div class="sys-deco" style="--r:29; --b:67"></div>

      <div class="sys-layout">

      <!-- 왼쪽: ① 얼굴에 점 찍기 (안내는 제목줄, 다시찍기 버튼은 아래줄) -->
      <section class="sys-left-panel">
        <div class="sys-bar sys-bar--top sys-bar--title">
          <span class="sys-step">01</span>
          <span class="sys-title">얼굴에 점 찍기</span>
          <span class="sys-hint">사진을 클릭해 점을 찍어보세요</span>
        </div>
        <div id="faceContainer">

        </div>
        <div class="sys-foot">
          <button class="sys-btn" id="retakeBtn" onclick="window.location.href='camera.html#retake'">사진 다시찍기</button>
          <button class="sys-btn" id="resetBtn">점 다시찍기</button>
        </div>
      </section>

      <!-- 오른쪽: ② 점 패턴 → 궁 설명 → 분석하기 -->
      <div class="sys-col">
        <section class="sys-right-top">
          <div class="sys-bar sys-bar--top sys-bar--title">
            <span class="sys-step">02</span>
            <span class="sys-title">점 패턴</span>
          </div>
          <div id="chartControls">
            <button id="zoomInBtn" aria-label="크게">+</button>
            <button id="zoomOutBtn" aria-label="작게">−</button>
          </div>
          <div class="sys-chart-area">
            <svg id="radialSvg" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
        </section>

        <section class="sys-right-bottom">
          <div class="sys-bar sys-bar--top sys-bar--title sys-bar--sub">
            <span class="sys-title">궁(宮) 설명</span>

          <p class="pdc-empty">점을 찍으면 그 자리의 궁(宮) 설명이 여기에 나타납니다.</p>
        </section>

        <button id="analyzeBtn">분석하기 <span aria-hidden="true">→</span></button>
      </div>

    <canvas id="photoCanvas" style="display:none;"></canvas>

    <!-- 블러 도움말 (보관용): 실제 도움말은 camera-help.html 슬라이드. 이미지 다시 캡처할 때만 — system.html#capture=1~2 -->
    <script src="help-tour.js"></script>
    <script>
      (function () {
        if (!window.helpTourCapture) return;
        // 얼굴 사진 자리에 흰 배경 예시 사진 (모든 단계)
        const sample = document.createElement('img');
        sample.className = 'help-sample-face';
        sample.src = 'images/help/sample-face.png';
        sample.alt = '';
        document.getElementById('faceContainer').appendChild(sample);
        // 예시 점: 얼굴 위 몇 군데를 실제로 클릭한 것처럼 → 점·연결선·방사형 차트 패턴이 그려짐
        // (그리드 안 비율 위치: 오른쪽 이마, 왼쪽 볼, 오른쪽 입가)
        const grid = document.getElementById('grid');
        const gr = grid.getBoundingClientRect();
        [[0.63, 0.22], [0.29, 0.59], [0.61, 0.77]].forEach(([fx, fy]) => {
          grid.dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: gr.left + gr.width * fx, clientY: gr.top + gr.height * fy }));
        });
        startHelpTour([
          {
            // 얼굴 패널만 패널 모양 그대로 선명, 위에 겹친 안내·버튼 패널은 블러
            text: '얼굴 위에 점을 찍어보세요.',
            hole: '.sys-left-panel', shape: true, blurOverlaps: true,
            // Figma: 패널이 얼굴 패널 왼쪽에 걸침 (얼굴 패널 폭 650 기준 왼쪽 -296, 위 +476)
            panel: (h) => { const k = (h.right - h.left) / 650; return { left: h.left - 296 * k, top: h.top + 476 * k }; },
          },
          {
            // 화면 왼쪽 방사형 차트 패널만 선명, 패널은 그 오른쪽 옆
            text: '찍은 점은 패턴으로 재구성됩니다.',
            hole: '.sys-right-top', shape: true, blurOverlaps: true, panel: 'right',
          },
        ]);
      })();
    </script>
  <script src="cursor.js" defer></script>
    <script src="help.js" defer></script>
<script src="sound.js" defer></script>
