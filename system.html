<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Face System</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="nav.css" />
    <link rel="stylesheet" href="system.css" />
  </head>
  <body>
    <!-- 상단 네비게이션 바 -->
    <nav class="topNav">
      <span class="navLeft">PROJECT: DOT SHIFT</span>
      <div class="navCenter">
        <svg width="35" height="7" viewBox="0 0 35 7" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="3.5" cy="3.5" r="3.5" fill="black" />
          <circle cx="17.5" cy="3.5" r="3.5" fill="black" />
          <circle cx="31.5" cy="3.5" r="3.5" fill="black" />
        </svg>
      </div>
      <span class="navRight">Everything starts from a dot</span>
    </nav>

    <div id="systemLayout">

      <!-- ── 왼쪽 패널: 흰 배경 + 그리드 텍스처 + 얼굴 ── -->
      <div id="leftPanel">
        <!-- 얼굴 컨테이너 (노란 둥근 사각형) -->
        <div id="faceContainer">
          <canvas id="savedCanvas"></canvas>
          <!-- 점 표시용 오버레이 캔버스 -->
          <canvas id="dotCanvas"></canvas>
          <img id="facegridOverlay" src="images/facegrid.png" alt="" />
          <div id="grid"></div>
        </div>

        <div id="btnRow">
          <button id="resetBtn">다시찍기</button>
          <button id="analyzeBtn">분석하기</button>
        </div>
      </div>

      <!-- ── 오른쪽 패널: 방사형 차트 ── -->
      <div id="rightPanel">
        <!-- +/- 줌 버튼 -->
        <div id="chartControls">
          <button id="zoomInBtn">+</button>
          <button id="zoomOutBtn">−</button>
        </div>

        <svg id="radialSvg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="bottomNav">
      <div class="bottomLogo">DOT SHIFT</div>
      <div class="navBadges">
        <span class="badge badge--h" onclick="window.location.href='index.html'">H</span>
        <span class="badge badge--b" onclick="history.back()">B</span>
      </div>
      <button class="bottomNavBtn" onclick="window.location.href='index.html'">
        <span>프로젝트 알아보기</span>
        <img src="https://www.figma.com/api/mcp/asset/7561d293-b240-400a-a8ff-d579225efbb0" alt="" />
      </button>
      <button class="bottomNavBtn" onclick="window.location.href='camera.html'">
        <span>점 패턴 분석하기</span>
        <img src="https://www.figma.com/api/mcp/asset/7561d293-b240-400a-a8ff-d579225efbb0" alt="" />
      </button>
      <button class="bottomNavBtn" onclick="window.location.href='facemap.html'">
        <span>얼굴 지도 살펴보기</span>
        <img src="https://www.figma.com/api/mcp/asset/7561d293-b240-400a-a8ff-d579225efbb0" alt="" />
      </button>
      <button class="bottomNavBtn" onclick="window.location.href='gwansang.html'">
        <span>관상학 알아보기</span>
        <img src="https://www.figma.com/api/mcp/asset/7561d293-b240-400a-a8ff-d579225efbb0" alt="" />
      </button>
      <button class="helpBtn"><span class="helpIcon">?</span></button>
    </nav>

    <script src="system.js"></script>
  </body>
</html>
