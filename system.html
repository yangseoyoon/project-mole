<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>분석 | DOT SHIFT</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="nav.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="system.css" />
  </head>
  <body class="rwd">

    <nav class="topNav">
      <a class="navLeft" href="index.html">PROJECT: DOT SHIFT</a>
      <span class="navRight">Everything starts from a dot</span>
    </nav>

    <div class="systemPage">

      <!-- 배경 -->
      <img class="sys-bg" src="images/cam-bg.png" alt="" />

      <!-- 장식 원들 (Figma 1920×1080 기준, 가까운 가장자리에서의 거리) -->
      <div class="sys-deco" style="--l:28; --t:142"></div>
      <div class="sys-deco" style="--l:52; --t:166"></div>
      <div class="sys-deco" style="--r:1; --t:88"></div>
      <div class="sys-deco" style="--r:-23; --t:112"></div>
      <div class="sys-deco sys-deco--orange" style="--l:72; --b:123"></div>
      <div class="sys-deco sys-deco--orange" style="--l:174; --b:43"></div>
      <div class="sys-deco sys-deco--orange" style="--r:-19; --t:318"></div>
      <div class="sys-deco" style="--r:103; --b:293"></div>
      <div class="sys-deco" style="--r:79; --b:269"></div>
      <div class="sys-deco" style="--r:53; --b:91"></div>
      <div class="sys-deco" style="--r:29; --b:67"></div>

      <div class="sys-layout">

      <!-- 왼쪽 패널: 얼굴 + 그리드 -->
      <div class="sys-left-panel">
        <div class="sys-bar sys-bar--top"></div>
        <div id="faceContainer">
          <canvas id="savedCanvas"></canvas>
          <canvas id="dotCanvas"></canvas>
          <div id="grid"></div>
        </div>
        <button class="sys-bar sys-bar--bottom" id="retakeBtn" onclick="window.location.href='camera.html'">사진 다시찍기</button>
      </div>

      <!-- 클릭 안내 툴팁 -->
      <div id="click-hint">
        <p>사진을 클릭해</p>
        <p>점을 찍어보세요!</p>
      </div>

      <!-- 중간 패널: 버튼 -->
      <div class="sys-mid-panel">
        <button id="resetBtn">점 다시찍기</button>
        <button id="analyzeBtn">분석하기</button>
      </div>

      <!-- 오른쪽 상단 패널: 방사형 차트 -->
      <div class="sys-right-top">
        <div class="sys-bar sys-bar--top sys-bar--sm"></div>
        <div class="sys-chart-area">
          <svg id="radialSvg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="chartControls">
            <button id="zoomInBtn">+</button>
            <button id="zoomOutBtn">−</button>
          </div>
        </div>
      </div>

      <!-- 오른쪽 하단 패널 -->
      <div class="sys-right-bottom">
        <div class="sys-bar sys-bar--top sys-bar--sm sys-bar--label">궁(宮) 설명</div>
      </div>

      </div>
    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="bottomNav">
      <div class="bn-inner">
        <img class="bn-logo-l" style="width:23.456px;height:29.129px;left:40px;top:22.99px" src="images/nav/logo-D.svg" alt="">
        <img class="bn-logo-l" style="width:29.935px;height:29.935px;left:66.65px;top:22.59px" src="images/nav/logo-O.svg" alt="">
        <img class="bn-logo-l" style="width:22.571px;height:29.129px;left:98.09px;top:22.99px" src="images/nav/logo-T.svg" alt="">
        <img class="bn-logo-l" style="width:21.726px;height:30.015px;left:134.06px;top:22.59px" src="images/nav/logo-S.svg" alt="">
        <img class="bn-logo-l" style="width:23.336px;height:29.129px;left:160.53px;top:22.99px" src="images/nav/logo-H.svg" alt="">
        <img class="bn-logo-l" style="width:4.426px;height:29.129px;left:189.82px;top:22.99px" src="images/nav/logo-I.svg" alt="">
        <img class="bn-logo-l" style="width:18.065px;height:29.129px;left:200.16px;top:22.99px" src="images/nav/logo-F.svg" alt="">
        <img class="bn-logo-l" style="width:22.571px;height:29.129px;left:221.73px;top:22.99px" src="images/nav/logo-T.svg" alt="">
        <a class="bn-badge bn-badge--h" href="index.html">H</a>
        <button class="bn-badge bn-badge--b" onclick="history.back()">B</button>
        <button class="bn-item" style="left:450px" onclick="window.location.href='index.html'">
          <span>프로젝트 알아보기</span>
          <img src="images/nav/nav-arrow.svg" alt="">
        </button>
        <button class="bn-item" style="left:790px" onclick="window.location.href='camera.html'">
          <span>점 패턴 분석하기</span>
          <img src="images/nav/nav-arrow.svg" alt="">
        </button>
        <button class="bn-item" style="left:1130px" onclick="window.location.href='facemap-celeb.html'">
          <span>얼굴 지도 살펴보기</span>
          <img src="images/nav/nav-arrow.svg" alt="">
        </button>
        <button class="bn-item" style="left:1470px" onclick="window.location.href='gwansang.html'">
          <span>관상학 알아보기</span>
          <img src="images/nav/nav-arrow.svg" alt="">
        </button>
        <div class="bn-right-bg"></div><button class="bn-help-btn">?</button>
      </div>
    </nav>

    <canvas id="photoCanvas" style="display:none;"></canvas>
    <script src="system.js"></script>
  <script src="cursor.js" defer></script>
    <script src="help.js" defer></script>
<script src="sound.js" defer></script>
  </body>
</html>
