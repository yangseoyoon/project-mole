    <div class="cameraWrap page-scale">
      <!-- 뒷 배경 이미지: cam-bg1 타일링 -->
      <div class="bg-overlay"></div>

      <!-- 내부 요소 80% 스케일 래퍼 -->
      <div class="inner-scale">
        <!-- 브라우저 창 -->
        <div class="browser-window">
          <!-- 타이틀바 -->
          <div class="win-titlebar">
            <span class="win-dot"></span>
            <span class="win-dot"></span>
            <span class="win-dot"></span>
          </div>

          <!-- 카메라 영역 (검정) -->
          <div class="win-body">
            <video id="video" autoplay playsinline muted></video>
            <!-- 가이드 오버레이 -->
            <div class="guide-wrap">
              <div class="guide-inner">
                <img src="images/cam/guide-overlay-new.svg" alt="" />
              </div>
            </div>
          </div>

          <!-- 하단 바 -->
          <div class="win-footer">
            <!-- 3-세그먼트 툴바 -->
            <div class="win-toolbar">
              <div class="win-seg seg-active" id="segDefault" onclick="if(window.stopTextFilter)stopTextFilter();if(window.stopStickerFilter)stopStickerFilter();document.querySelectorAll('.win-seg').forEach(function(s){s.classList.remove('seg-active')});this.classList.add('seg-active');"><span>기본</span></div>
              <div class="win-seg" onclick="toggleStickerFilter(this)"><span>도트화</span></div>
              <div class="win-seg" onclick="toggleTextFilter(this)"><span>2D 메쉬</span></div>
            </div>

            <!-- 촬영 버튼 -->
            <button id="captureBtn" class="captureBtn">
              <img src="images/cam/cam-btn.svg" alt="촬영" />
            </button>

            <!-- 가이드 토글 버튼 -->
            <button class="reset-btn" id="guideToggleBtn" onclick="toggleGuide(this)">
              가이드 OFF
            </button>
          </div>
        </div>

        <!-- 좌측 패널 이미지 -->
        <img class="left-panel" src="images/cam/left-panel.svg" alt="" />

        <!-- 말풍선: 눈썹 가이드 -->
        <div class="hint-pill hint-eyebrow">선 중앙에 눈썹을 맞추세요!</div>

        <!-- 말풍선: 얼굴 가이드 -->
        <div class="hint-pill hint-face">노란색 원에 얼굴을 맞추세요!</div>

        <!-- 데코 벡터 라인 -->
        <img class="deco-vector deco-vector-left"  src="images/cam/vector-left.svg"  alt="" />
        <img class="deco-vector deco-vector-right" src="images/cam/vector-right.svg" alt="" />

        <!-- 장식 원들: Figma 기준 위치 (77×77px) -->
        <!-- 주황 원 (imgEllipse426) -->
        <div style="position:absolute;left:1870px;top:319px;width:77px;height:77px;border-radius:50%;background:#fe6c48;border:1px solid #000;pointer-events:none;"></div>

    <script>
      function toggleGuide(btn) {
        var guide = document.querySelector('.guide-wrap');
        if (!guide) return;
        var on = guide.style.display === 'none';
        guide.style.display = on ? '' : 'none';
        btn.textContent = on ? '가이드 OFF' : '가이드 ON';
      }
    </script>
    <script>
