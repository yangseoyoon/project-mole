<!doctype html>

    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"

  <body>
    <nav class="topNav">
      <a class="navLeft" href="index.html">PROJECT: DOT SHIFT</a>

    <div class="cameraWrap page-scale">
      <!-- 뒷 배경 이미지: 1920×1080 전체 (스케일 제외) -->
      <img class="bg-overlay" src="images/cam/cam-bg.png" alt="" />

      <!-- 내부 요소 80% 스케일 래퍼 -->
      <div class="inner-scale">
        <!-- 브라우저 창 -->
        <div class="browser-window">
          <!-- 타이틀바 -->
          <div class="win-titlebar">
            <span class="win-dot win-dot--red"></span>
            <span class="win-dot win-dot--yellow"></span>
            <span class="win-dot win-dot--green"></span>
          </div>

          <!-- 카메라 영역 (검정) -->
          <div class="win-body">
            <video id="video" autoplay playsinline muted></video>
            <!-- 가이드 오버레이 -->
            <div class="guide-wrap">
              <div class="guide-inner">
                <img src="images/cam/guide-overlay.svg" alt="" />
              </div>
            </div>
          </div>

          <!-- 하단 바 -->
          <div class="win-footer">
            <!-- 3-세그먼트 툴바 -->
            <div class="win-toolbar">
              <div class="win-seg"><span>기본</span></div>
              <div class="win-seg"><span>스티커</span></div>
              <div class="win-seg"><span>텍스트</span></div>
            </div>

            <!-- 촬영 버튼 -->
            <button id="captureBtn" class="captureBtn">
              <img src="images/cam/cam-btn.svg" alt="촬영" />
            </button>

            <!-- 초기화 버튼 -->
            <button class="reset-btn" onclick="location.reload()">
              초기화
            </button>
          </div>
        </div>

        <!-- 좌측 회색 패널 -->
        <div class="left-panel"></div>

        <!-- 말풍선: 눈썹 가이드 -->
        <div class="hint-pill hint-eyebrow">선 사이에 눈썹을 맞추세요!</div>

        <!-- 말풍선: 얼굴 가이드 -->
        <div class="hint-pill hint-face">노란색 원에 얼굴을 맞추세요!</div>

        <!-- 폴더 장식들: Figma 정확 좌표 -->
        <img
          class="deco-folder"
          style="left: 1733px; top: 113px"
          src="images/cam/folder-red.svg"
          alt=""
        />

        />
        <img
          class="deco-folder"
          style="left: 37.74px; top: 77.01px"
          src="images/cam/folder-yellow.svg"
          alt=""
        />
