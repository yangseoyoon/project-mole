<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>웹캠페이지</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="nav.css" />
    <link rel="stylesheet" href="camera.css" />
  </head>
  <body>
    <!-- 상단 네비게이션 바 -->
    <nav class="topNav">
      <span class="navLeft">PROJECT: DOT SHIFT</span>
      <div class="navCenter">
        <svg width="35" height="7" viewBox="0 0 35 7" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="3.5" cy="3.5" r="3.5" fill="black" />
          <circle cx="17.5" cy="3.5" r="3.5" fill="black" />
          <circle cx="31.5" cy="3.5" r="3.5" fill="black" />
        </svg>
      </div>
      <span class="navRight">Everything starts from a dot</span>
    </nav>

    <div class="cameraPage">
      <!-- 카메라 영역 (검정 네모) -->
      <div class="cameraFrame">
        <video id="video" autoplay playsinline muted></video>

        <!-- 가이드 오버레이 이미지 -->
        <img class="guideOverlay" src="images/guide.png" alt="" />

        <!-- 하단 촬영 버튼 -->
        <button id="captureBtn" class="captureBtn" title="촬영">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="19" stroke="#e9f056" stroke-width="2"/>
            <path d="M10 16.5C10 15.4 10.9 14.5 12 14.5H14.5L16 12H24L25.5 14.5H28C29.1 14.5 30 15.4 30 16.5V26C30 27.1 29.1 28 28 28H12C10.9 28 10 27.1 10 26V16.5Z" stroke="#e9f056" stroke-width="1.8"/>
            <circle cx="20" cy="21" r="4" stroke="#e9f056" stroke-width="1.8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="bottomNav">
      <div class="bottomLogo">DOT SHIFT</div>
      <div class="navBadges">
        <span class="badge badge--h" onclick="window.location.href='index.html'">H</span>
        <span class="badge badge--b" onclick="history.back()">B</span>
      </div>
      <button class="bottomNavBtn" onclick="window.location.href='index.html'">
        <span>프로젝트 알아보기</span>
        <img src="https://www.figma.com/api/mcp/asset/7561d293-b240-400a-a8ff-d579225efbb0" alt="" />
      </button>
      <button class="bottomNavBtn" onclick="window.location.href='camera.html'">
        <span>점 패턴 분석하기</span>
        <img src="https://www.figma.com/api/mcp/asset/7561d293-b240-400a-a8ff-d579225efbb0" alt="" />
      </button>
      <button class="bottomNavBtn" onclick="window.location.href='facemap.html'">
        <span>얼굴 지도 살펴보기</span>
        <img src="https://www.figma.com/api/mcp/asset/7561d293-b240-400a-a8ff-d579225efbb0" alt="" />
      </button>
      <button class="bottomNavBtn" onclick="window.location.href='gwansang.html'">
        <span>관상학 알아보기</span>
        <img src="https://www.figma.com/api/mcp/asset/7561d293-b240-400a-a8ff-d579225efbb0" alt="" />
      </button>
      <button class="helpBtn"><span class="helpIcon">?</span></button>
    </nav>

    <canvas id="photoCanvas" style="display:none;"></canvas>
    <script src="camera.js"></script>
  </body>
</html>
