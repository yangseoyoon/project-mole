    <script>
      // ── 줌 슬라이더 (도트) ──────────────────────────────────────
      (function() {
        var valLabel = document.getElementById('zoomVal');
        var dotsWrap = document.getElementById('zoomDots');
        var video = document.getElementById('video');
        var videoRight = document.getElementById('videoRight');

        var STEPS = 10;
        var MIN = 1, MAX = 3;
        var currentIdx = 0;

        // 도트 생성
        var dots = [];
        for (var i = 0; i < STEPS; i++) {
          var d = document.createElement('div');
          var size = 5 + i * 1.5;
          d.style.cssText = 'width:calc('+size+' * var(--cu));height:calc('+size+' * var(--cu));border-radius:50%;background:#fff;cursor:pointer;transition:background 0.15s;flex-shrink:0;';
          d.dataset.idx = i;
          d.addEventListener('click', (function(idx) {
            return function() { setDot(idx); };
          })(i));
          dotsWrap.appendChild(d);
          dots.push(d);
        }

        function setDot(idx) {
          idx = Math.max(0, Math.min(STEPS - 1, idx));
          currentIdx = idx;
          var z = MIN + (idx / (STEPS - 1)) * (MAX - MIN);
          window.cameraZoom = z;
          video.style.transform = 'scaleX(-1) scale(' + z + ')';
          if (videoRight) videoRight.style.transform = 'scaleX(-1) scale(1.06)';
          valLabel.textContent = z.toFixed(2).replace(/\.?0+$/, '') + '×';
          dots.forEach(function(d, i) {
            d.style.background = i <= idx ? '#fe6c48' : '#ffffff';
          });
        }

        function idxFromX(clientX) {
          var rect = dotsWrap.getBoundingClientRect();
          var pct = (clientX - rect.left) / rect.width;
          return Math.round(pct * (STEPS - 1));
        }

        var dragging = false;

        dotsWrap.addEventListener('mousedown', function(e) {
          dragging = true;
          setDot(idxFromX(e.clientX));
        });
        document.addEventListener('mousemove', function(e) {
          if (dragging) setDot(idxFromX(e.clientX));
        });
        document.addEventListener('mouseup', function() { dragging = false; });

        dotsWrap.addEventListener('touchstart', function(e) {
          e.preventDefault();
          setDot(idxFromX(e.touches[0].clientX));
        }, { passive: false });
        dotsWrap.addEventListener('touchmove', function(e) {
          e.preventDefault();
          setDot(idxFromX(e.touches[0].clientX));
        }, { passive: false });

        setDot(0);
      })();

      function toggleGuide(btn) {
        var guide = document.querySelector('.guide-wrap');
        if (!guide) return;
        var on = guide.style.display === 'none';
        guide.style.display = on ? '' : 'none';
        btn.textContent = on ? '가이드 OFF' : '가이드 ON';
      }
    </script>

         이 코드는 슬라이드 이미지를 다시 캡처할 때만 씀 — camera.html#capture=1~3 (images/help/slides/README.md 참고) -->
    <script src="help-tour.js"></script>
    <script>
      // 도움말 동안은 웹캠 대신 예시 화면
      //  - 카메라 창: Figma 2131:1761 (창 전체 1236×880 을 화면 영역 위치에 맞춰 덮음)
      //  - 왼쪽 위 작은 화면: 같은 여성 사진
      //  - 오른쪽 아래 2D 메쉬: 메쉬 숨김 (노란 배경만)
      const sampleCam = () => {
        const add = (parent, cls, src) => {
          const img = document.createElement('img');
          img.className = cls;
          img.src = src;
          img.alt = '';
          parent.appendChild(img);
        };
        add(document.querySelector('.win-body'), 'help-sample-cam', 'images/help/sample-camera.png');
        add(document.getElementById('canvasLeft').parentElement, 'help-sample-side', 'images/help/sample-face.png');
        document.body.classList.add('help-demo');
      };
      if (window.helpTourCapture) { sampleCam(); startHelpTour([
        { text: '자신이 어떤 점 패턴을 가지고 있는지 직접 얼굴에 점을<br>찍어 알아볼 수 있습니다.' },
        {
          // 카메라 창만 선명, 패널은 창 왼쪽 위 모서리에 걸침 (Figma: 창 왼쪽에서 -167, 위에서 +125, 창 폭 1174 기준)
          text: '가이드 선에 맞춰서 얼굴 사진을 찍어주세요.',
          // 카메라 창 모양(둥근 모서리) 그대로만 선명, 창 위에 겹친 패널·말풍선은 블러
          hole: '.browser-window', shape: true, blurOverlaps: true,
          panel: (h) => { const k = (h.right - h.left) / 1174; return { left: h.left - 167 * k, top: h.top + 125 * k }; },
        },
        {
          // 카메라 창 아래 크기 조절 슬라이더만 선명
          text: '아래 슬라이드로 얼굴크기를 쉽게 맞출 수 있습니다.',
          // 너무 작아서 이 단계에서만 2배 확대, 확대되며 겹치는 옆 버튼은 블러
          // 패널은 슬라이더 왼쪽 옆, 세로 가운데
          hole: '.zoom-wrap', pad: 14, zoom: 2, blurOverlaps: true, panel: 'left',
        },
      ], { onFinish: () => { sessionStorage.setItem('helpTour', 'system'); location.href = 'system.html'; },
        onEnd: () => {
          document.querySelectorAll('.help-sample-cam, .help-sample-side').forEach(el => el.remove());
          document.body.classList.remove('help-demo');
        } }); }
    </script>
