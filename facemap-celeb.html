    <script>
      const PROFILES = {
        jay: {
          name: 'Jay',
          desc: '대한민국 6인조 보이그룹 ENHYPEN의 멤버',
          photo: 'images/facemap/photo-jay.png',

        gaeul: {
          name: 'Gaeul',
          desc: '대한민국 6인조 걸그룹 IVE의 멤버',
          photo: 'images/facemap/photo-gaeul.png',
        },
        iroha: {
          name: 'Iroha',
          desc: '대한민국 5인조 걸그룹 ILLIT의 멤버',
          photo: 'images/facemap/photo-iroha.png',
        },
        enrique: {
          name: 'Enrique Iglesias',
          desc: '스페인 출신의 세계적인 라틴 팝 싱어송라이터',
          photo: 'images/facemap/photo-enrique.png',
        },
        kosoyoung: {
          name: 'Ko So-young',
          desc: '대한민국의 배우',
          photo: 'images/facemap/photo-kosoyoung.png',
        },
        jeonjihyun: {
          name: 'Jun Ji-hyun',
          desc: '대한민국의 배우',
          photo: 'images/facemap/photo-jeonjihyun.png',
        },
        jangwonyoung: {
          name: 'Jang Won-young',
          desc: '대한민국 6인조 걸그룹 IVE의 멤버',
          photo: 'images/facemap/photo-jangwonyoung.png',
        },
        rei: {
          name: 'Rei',
          desc: '대한민국 6인조 걸그룹 IVE의 멤버',
          photo: 'images/facemap/photo-rei.png',
        },
        marilyn: {
          name: 'Marilyn Monroe',
          desc: '미국의 배우이자 모델이자 가수',
          photo: 'images/facemap/photo-marilyn.png',
        },
        cindy: {
          name: 'Cindy Crawford',
          desc: '미국의 슈퍼모델이자 배우',
          photo: 'images/facemap/photo-cindy.png',
        },
        bibi: {
          name: 'BIBI',
          desc: '대한민국의 솔로 아티스트이자 배우',
          photo: 'images/facemap/photo-bibi.png',
        },
        iu: {
          name: 'IU',
          desc: '대한민국의 솔로 아티스트이자 배우',
          photo: 'images/facemap/photo-iu.png',
        },
        aoiyu: {
          name: 'Aoi Yu',
          desc: '일본의 배우',
          photo: 'images/facemap/photo-aoiyu.png',
        },
        komatsunana: {
          name: 'Komatsu Nana',
          desc: '일본의 배우이자 모델',
          photo: 'images/facemap/photo-komatsunana.png',
        },
        jenny: {
          name: 'Jennie',
          desc: '대한민국 4인조 걸그룹 BLACKPINK의 멤버이자 솔로 아티스트',
          photo: 'images/facemap/photo-jenny.png',
        },
      };

      const bubble = document.getElementById('profileBubble');
      const bPhoto = document.getElementById('bubblePhoto');
      const bName = document.getElementById('bubbleName');
      const bDesc = document.getElementById('bubbleDesc');
      let activeDot = null;

      document.querySelectorAll('[data-profile]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (activeDot === btn && bubble.classList.contains('active')) {
            bubble.classList.remove('active');
            btn.classList.remove('active');
            activeDot = null;
            return;
          }
          if (activeDot) activeDot.classList.remove('active');
          activeDot = btn;
          btn.classList.add('active');
          const p = PROFILES[btn.dataset.profile];
          bPhoto.src = p.photo;
          bName.textContent = p.name;
          bDesc.textContent = p.desc;

          placeBubble(bubble, btn);
          bubble.classList.add('active');
        });
      });

      document.addEventListener('click', () => {
        bubble.classList.remove('active');
        if (activeDot) activeDot.classList.remove('active');
        activeDot = null;
      });

      /* 진입 안내 팝업: X, 바깥 클릭, Esc 로 닫기 */
      (function () {
        const overlay = document.getElementById('welcomeOverlay');
        const close = () => overlay.classList.remove('active');
        // 네비게이션바로 새로 들어왔을 때만 (help-gate.js)
        if (!helpGate('facemap-celeb')) close();
        document.getElementById('welcomeClose').addEventListener('click', close);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
      })();
    </script>
