    <script>
      const DOT_LABELS = [
        {
          label: 'MOLE',
          desc: '피부에 멜라닌 세포가 침착되어 신체 위에 나타나는 점',
        },
        { label: 'SPOT', desc: '반점 혹은 얼룩같은 불규칙한 흔적' },
        { label: 'NEVUS', desc: '의학적 용어로의 모반' },
        {
          label: 'POINT',
          desc: '수학 혹은 언어학에서의 위치를 나타내는 최소단위',
        },
        { label: 'DOT', desc: '시각적으로 보이는 둥근 점' },
      ];
      document.querySelectorAll('.heroDot').forEach((dot) => {
        const item = DOT_LABELS[Math.floor(Math.random() * DOT_LABELS.length)];
        dot.querySelector('.dot-label').textContent = item.label;
        dot.querySelector('.dot-desc').textContent = item.desc;
      });
    </script>
