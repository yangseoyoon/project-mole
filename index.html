    <script>
    (function() {
      const W = 1920, H = 1080, CX = W/2, CY = H/2;
      const dots = Array.from(document.querySelectorAll('.heroDot'));

      // 각 점의 3D 좌표 (center 기준 x,y, 랜덤 z 깊이) + 랜덤 float 애니메이션
      const dotData = dots.map(dot => {
        const dur   = (1.2 + Math.random() * 1.2).toFixed(2) + 's';
        const delay = (Math.random() * 3.0).toFixed(2) + 's';
        dot.style.setProperty('--dot-dur',   dur);
        dot.style.setProperty('--dot-delay', delay);
        return {
          el:  dot,
          ox:  parseFloat(dot.style.left) - CX,
          oy:  parseFloat(dot.style.top)  - CY,
          oz:  (Math.random() - 0.5) * 700
        };
      });

      let rotY = 0, rotX = 0, tRotY = 0, tRotX = 0;
      let dragging = false, lastX = 0, lastY = 0;
      const MAX = Math.PI / 6;

      function project(ox, oy, oz, rY, rX) {
        const x1 =  ox * Math.cos(rY) + oz * Math.sin(rY);
        const z1 = -ox * Math.sin(rY) + oz * Math.cos(rY);
        const y2 =  oy * Math.cos(rX) - z1 * Math.sin(rX);
        return { x: CX + x1, y: CY + y2 };
      }

      function tick() {
        rotY += (tRotY - rotY) * 0.08;
        rotX += (tRotX - rotX) * 0.08;
        dotData.forEach(d => {
          const p = project(d.ox, d.oy, d.oz, rotY, rotX);
          d.el.style.transform =
            `translate(${(p.x - (d.ox+CX)).toFixed(2)}px,${(p.y - (d.oy+CY)).toFixed(2)}px)`;
        });
        requestAnimationFrame(tick);
      }
      tick();

      window.addEventListener('mousedown', e => {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'grabbing';
      });
      window.addEventListener('mousemove', e => {
        if (!dragging) return;
        e.preventDefault();
        tRotY = Math.max(-MAX, Math.min(MAX, tRotY + (e.clientX - lastX) * 0.005));
        tRotX = Math.max(-MAX, Math.min(MAX, tRotX - (e.clientY - lastY) * 0.005));
        lastX = e.clientX; lastY = e.clientY;
      }, { passive: false });
      window.addEventListener('mouseup', () => {
        dragging = false; tRotY = 0; tRotX = 0;
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
      });

      // 터치
      window.addEventListener('touchstart', e => {
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        dragging = true;
      }, { passive: true });
      window.addEventListener('touchmove', e => {
        if (!dragging) return;
        tRotY = Math.max(-MAX, Math.min(MAX, tRotY + (e.touches[0].clientX - lastX) * 0.005));
        tRotX = Math.max(-MAX, Math.min(MAX, tRotX - (e.touches[0].clientY - lastY) * 0.005));
        lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchend', () => { dragging = false; tRotY = 0; tRotX = 0; });

      // 이미지·텍스트 드래그 방지
      document.addEventListener('dragstart', e => e.preventDefault());
      document.querySelectorAll('img').forEach(img => img.draggable = false);
    })();
    </script>
