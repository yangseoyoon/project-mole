      .banwiPage {
        position: fixed;
        top: 0; left: 0;

        background: #e9f056;
        transform-origin: top left;
      }
      #blurOverlay {
        position: absolute;
        inset: 0;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        background: rgba(233,240,86,0.25);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.5s ease;
        z-index: 10;
      }
      #blurOverlay.active { opacity: 1; }

      #axisPanel {
        position: fixed;
        right: 60px;
        top: 50%;
        transform: translateY(-50%) translateX(120%);
        width: 360px;
        min-height: 300px;
        background: #fff;
        border: 1.5px solid #000;
        padding: 48px 40px;
        opacity: 0;
        transition: transform 0.65s cubic-bezier(0.16,1,0.3,1), opacity 0.45s ease;
        z-index: 1000;
      }
      #axisPanel.active {
        transform: translateY(-50%) translateX(0);
        opacity: 1;
      }
      #axisPanel .panel-close {
        position: absolute;
        top: 16px; right: 20px;
        font-size: 18px;
        cursor: pointer !important;
        background: none; border: none;
        color: #000;
      }
      #axisPanel .panel-title {
        font: 700 28px "Pretendard JP","Pretendard",sans-serif;
        color: #ea5c3a;
        margin-bottom: 16px;
      }
      #axisPanel .panel-body {
        font: 400 16px "Pretendard",sans-serif;
        color: #333;
        line-height: 1.7;
      }
    </style>

    <script>
      const canvas = document.getElementById('axisCanvas');
      const ctx = canvas.getContext('2d');
      const actCanvas = document.getElementById('activeCanvas');
      const actCtx = actCanvas.getContext('2d');
      const W = 1920, H = 1080;
      const OX = 946.5, OY = 560;
      const B = 340;
      const BXZ = 625;  // X·Z축: 피그마 기준 가로 1250px / 2
      const ARROW = 20, LOFF = 60;

      let rotY = Math.PI / 6, rotX = -Math.PI / 12;
      let zoom = 1, scrollP = 0;
      let panX = OX, panY = OY;
      let isDragging = false, dragMoved = false, lastX = 0, lastY = 0;

      // 그리드 전용 회전 — 드래그할 때만 갱신, 자동회전 미적용
      let gridRotY = Math.PI / 6, gridRotX = -Math.PI / 12;

      let anim = null;
      let overlayOpen = false;
      let activeAxisId = null;
      let activeHitType = null;
      let descHits = [];

      function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
      function lerp(a,b,t) { return a+(b-a)*t; }

      function getPageScale() {
        const el = document.querySelector('.page-scale');
        const m = el && el.style.transform && el.style.transform.match(/scale\(([^)]+)\)/);
        return m ? parseFloat(m[1]) : 1;
      }

      // 그리드 전용 투영 (gridRotY/X 사용)
      function tfGrid(p) {
        const c1=Math.cos(gridRotY), s1=Math.sin(gridRotY);
        const x1=p.x*c1+p.z*s1, y1=p.y, z1=-p.x*s1+p.z*c1;
        const c2=Math.cos(gridRotX), s2=Math.sin(gridRotX);
        const x2=x1, y2=y1*c2-z1*s2;
        return { x: panX+x2*zoom, y: panY-y2*zoom };
      }

      // 3D 투영 (panX/panY 기반)
      function tf(p) {
        const c1=Math.cos(rotY), s1=Math.sin(rotY);
        const x1=p.x*c1+p.z*s1, y1=p.y, z1=-p.x*s1+p.z*c1;
        const c2=Math.cos(rotX), s2=Math.sin(rotX);
        const x2=x1, y2=y1*c2-z1*s2;
        return { x: panX+x2*zoom, y: panY-y2*zoom };
      }

      // 목표 회전 상태에서의 3D→2D (panX/Y 없이 순수 로컬 좌표)
      function tfAt(p, rY, rX) {
        const c1=Math.cos(rY), s1=Math.sin(rY);
        const x1=p.x*c1+p.z*s1, y1=p.y, z1=-p.x*s1+p.z*c1;
        const c2=Math.cos(rX), s2=Math.sin(rX);
        return { x2: x1, y2: y1*c2-z1*s2 };
      }

      function arrow(a,b) {
        const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy);
        if(len<1) return;
        const ux=dx/len, uy=dy/len;
        ctx.beginPath();
        ctx.moveTo(b.x,b.y);
        ctx.lineTo(b.x-ux*ARROW-uy*ARROW*0.4, b.y-uy*ARROW+ux*ARROW*0.4);
        ctx.lineTo(b.x-ux*ARROW+uy*ARROW*0.4, b.y-uy*ARROW-ux*ARROW*0.4);
        ctx.closePath(); ctx.fill();
      }

      function label(p3,ch) {
        const p=tf(p3);
        ctx.font=`400 ${Math.round(40*zoom)}px "Pretendard JP","Pretendard",sans-serif`;
        ctx.fillStyle='#ea5c3a';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(ch,p.x,p.y);
      }

      function desc(p3,text) {
        const p=tf(p3);
        ctx.font=`500 ${Math.round(22*zoom)}px "Pretendard","Pretendard JP",sans-serif`;
        ctx.fillStyle='#000';
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(text,p.x,p.y);
      }

      // 축별 목표 카메라 (scrollP 1.36 → zoom 1.68, 기존 1.4 대비 20% 확대)
      const AXIS_TARGETS = {
        x: { rotY:0,          rotX:0,          scrollP:1.36 },
        y: { rotY:Math.PI/2,  rotX:0,          scrollP:1.36 },
        z: { rotY:Math.PI,    rotX:-Math.PI/8, scrollP:1.36 },
      };
      // 한자 → 축 매핑 (카메라 타겟용)
      const KANJI_AXIS = { '右':'x','左':'x','上':'y','下':'y','後':'z','前':'z' };

      // 9개 별개 창
      const PANEL_CONTENT = {
        '右':    { title:'右', body:'나중에 수정할 창입니다.' },
        '左':    { title:'左', body:'나중에 수정할 창입니다.' },
        '上':    { title:'上', body:'나중에 수정할 창입니다.' },
        '下':    { title:'下', body:'나중에 수정할 창입니다.' },
        '後':    { title:'後', body:'나중에 수정할 창입니다.' },
        '前':    { title:'前', body:'나중에 수정할 창입니다.' },
        x_desc:  { title:'X축 설명', body:'나중에 수정할 창입니다.' },
        y_desc:  { title:'Y축 설명', body:'나중에 수정할 창입니다.' },
        z_desc:  { title:'Z축 설명', body:'나중에 수정할 창입니다.' },
      };
      const DESC_P3 = {
        x:{ p3:{x:B*0.55, y:55,     z:0      } },
        y:{ p3:{x:-55,    y:B*0.55, z:0      } },
        z:{ p3:{x:0,      y:50,     z:-B*0.45} },
      };

      // hitId: 한자면 '右'등 문자, desc면 'x'/'y'/'z'
      function openPanel(hitId, hitType) {
        overlayOpen = true;
        activeAxisId = hitType === 'kanji' ? hitId : hitId; // 재렌더용
        activeHitType = hitType;
        isDragging = false;

        const axisId = hitType === 'kanji' ? KANJI_AXIS[hitId] : hitId;
        const tgt = AXIS_TARGETS[axisId];
        const tZoom = 1 + tgt.scrollP * 0.5;
        const dp = DESC_P3[axisId].p3;
        const { x2, y2 } = tfAt(dp, tgt.rotY, tgt.rotX);
        const tPanX = W * 0.38 - x2 * tZoom;
        const tPanY = H * 0.5  + y2 * tZoom;

        anim = {
          fRotY:rotY, fRotX:rotX, fScroll:scrollP, fPanX:panX, fPanY:panY,
          tRotY:tgt.rotY, tRotX:tgt.rotX, tScroll:tgt.scrollP,
          tPanX, tPanY, t:0, dur:90, opening:true
        };
        const contentKey = hitType === 'kanji' ? hitId : hitId + '_desc';
        const content = PANEL_CONTENT[contentKey];
        document.getElementById('panelTitle').textContent = content.title;
        document.getElementById('panelBody').textContent  = content.body;
        document.getElementById('axisPanel').classList.add('active');
      }

      function closePanel() {
        overlayOpen = false;
        activeAxisId = null;
        activeHitType = null;
        canvas.style.filter = 'none';
        anim = {
          fRotY:rotY, fRotX:rotX, fScroll:scrollP, fPanX:panX, fPanY:panY,
          tRotY:Math.PI/6, tRotX:-Math.PI/12, tScroll:0,
          tPanX:OX, tPanY:OY, t:0, dur:60, opening:false
        };
        document.getElementById('axisPanel').classList.remove('active');
      }

      // ── 메인 루프 ──
      function draw() {
        if (anim) {
          anim.t++;
          const e = easeInOut(Math.min(anim.t/anim.dur, 1));
          rotY    = lerp(anim.fRotY,   anim.tRotY,   e);
          rotX    = lerp(anim.fRotX,   anim.tRotX,   e);
          scrollP = lerp(anim.fScroll, anim.tScroll,  e);
          panX    = lerp(anim.fPanX,   anim.tPanX,   e);
          panY    = lerp(anim.fPanY,   anim.tPanY,   e);
          // CSS blur 애니메이션 (canvas 요소 자체에 적용 — 번짐 없음)
          const blurPx = (anim.opening ? e : 1-e) * 5;
          canvas.style.filter = blurPx > 0.1 ? `blur(${blurPx.toFixed(1)}px)` : 'none';
          if (anim.t >= anim.dur) anim = null;
        } else if (!isDragging && !overlayOpen) {
          rotY += 0.004;
        }

        zoom = 1 + scrollP * 0.5;
        ctx.clearRect(0, 0, W, H);

        // ── 3D 그리드 바닥면 (XZ 평면, y = -300) ──
        {
          const GY = -300;          // 바닥 높이
          const GRANGE = 2000;      // 그리드 범위 (±)
          const GSTEP  = 200;       // 격자 간격
          const steps = Math.ceil(GRANGE / GSTEP);

          // 그리드를 그린 뒤 방사형 그라디언트로 페이드
          ctx.save();

          // 클리핑: 화면 전체
          ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();

          ctx.lineWidth = 0.8;

          for (let i = -steps; i <= steps; i++) {
            const v = i * GSTEP;
            // Z 방향 선 (X 고정)
            const a = tfGrid({x: v, y: GY, z: -GRANGE});
            const b = tfGrid({x: v, y: GY, z:  GRANGE});
            // X 방향 선 (Z 고정)
            const c = tfGrid({x: -GRANGE, y: GY, z: v});
            const d = tfGrid({x:  GRANGE, y: GY, z: v});

            // 원점에서의 거리 비율로 투명도 결정
            const dist = Math.abs(v) / GRANGE;
            const alpha = (1 - dist * dist) * 0.18;
            ctx.strokeStyle = `rgba(120,110,0,${alpha.toFixed(3)})`;

            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.stroke();
          }

          // 방사형 그라디언트 페이드 (배경색으로)
          const grad = ctx.createRadialGradient(panX, panY, 0, panX, panY, Math.max(W, H) * 0.7);
          grad.addColorStop(0,   'rgba(233,240,86,0)');
          grad.addColorStop(0.6, 'rgba(233,240,86,0)');
          grad.addColorStop(1,   'rgba(233,240,86,0.92)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);

          ctx.restore();
        }

        const o  = tf({x:0,y:0,z:0});
        const xP = tf({x:BXZ,y:0,z:0}),  xN = tf({x:-BXZ,y:0,z:0});
        const yP = tf({x:0,y:B,z:0}),    yN = tf({x:0,y:-B,z:0});
        const zP = tf({x:0,y:0,z:BXZ}),  zN = tf({x:0,y:0,z:-BXZ});

        ctx.strokeStyle='#ea5c3a'; ctx.fillStyle='#ea5c3a'; ctx.lineWidth=2;

        ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(xN.x,xN.y); ctx.lineTo(xP.x,xP.y); ctx.stroke();
        arrow(xN,xP); arrow(xP,xN);

        ctx.beginPath(); ctx.moveTo(yN.x,yN.y); ctx.lineTo(yP.x,yP.y); ctx.stroke();
        arrow(yN,yP); arrow(yP,yN);

        ctx.setLineDash([10,12]);
        ctx.beginPath(); ctx.moveTo(zN.x,zN.y); ctx.lineTo(zP.x,zP.y); ctx.stroke();
        ctx.setLineDash([]);
        arrow(zN,zP); arrow(zP,zN);

        ctx.beginPath(); ctx.arc(o.x,o.y,5,0,Math.PI*2); ctx.fill();

        descHits = [];
        const labelDefs = [
          {p3:{x: BXZ+LOFF,y:0,z:0},   ch:'右'},
          {p3:{x:-BXZ-LOFF,y:0,z:0},   ch:'左'},
          {p3:{x:0,y: B+LOFF,z:0},     ch:'上'},
          {p3:{x:0,y:-B-LOFF,z:0},     ch:'下'},
          {p3:{x:0,y:0,z: BXZ+LOFF},   ch:'後'},
          {p3:{x:0,y:0,z:-BXZ-LOFF},   ch:'前'},
        ];
        for (const l of labelDefs) {
          if (!(activeHitType === 'kanji' && activeAxisId === l.ch)) {
            label(l.p3, l.ch);
          }
          const p=tf(l.p3);
          descHits.push({x:p.x, y:p.y, id:l.ch, type:'kanji'});
        }

        for (const [id, d] of Object.entries(DESC_P3)) {
          const p=tf(d.p3);
          if (!(activeHitType === 'desc' && activeAxisId === id)) {
            desc(d.p3, '이곳은 빈칸입니다.');
          }
          descHits.push({x:p.x, y:p.y, id, type:'desc'});
        }

        // 오버레이 canvas: 클릭된 요소만 선명하게
        actCtx.clearRect(0, 0, W, H);
        if (activeAxisId && activeHitType) {
          if (activeHitType === 'kanji') {
            const l = labelDefs.find(l => l.ch === activeAxisId);
            if (l) {
              const p = tf(l.p3);
              actCtx.font = `400 ${Math.round(40*zoom)}px "Pretendard JP","Pretendard",sans-serif`;
              actCtx.fillStyle = '#ea5c3a';
              actCtx.textAlign = 'center'; actCtx.textBaseline = 'middle';
              actCtx.fillText(l.ch, p.x, p.y);
            }
          } else {
            const p = tf(DESC_P3[activeAxisId].p3);
            actCtx.font = `500 ${Math.round(22*zoom)}px "Pretendard","Pretendard JP",sans-serif`;
            actCtx.fillStyle = '#000';
            actCtx.textAlign = 'center'; actCtx.textBaseline = 'middle';
            actCtx.fillText('이곳은 빈칸입니다.', p.x, p.y);
          }
        }

        requestAnimationFrame(draw);
      }

      // ── 이벤트 ──
      window.addEventListener('wheel', e => {
        if (overlayOpen) return;
        e.preventDefault();
        scrollP = Math.max(-1, Math.min(1, scrollP+e.deltaY*0.0008));
      }, { passive:false });

      canvas.addEventListener('mousedown', e => {
        isDragging = true; dragMoved = false;
        lastX=e.clientX; lastY=e.clientY;
      });
      window.addEventListener('mouseup', () => { isDragging = false; });
      window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        const dx=e.clientX-lastX, dy=e.clientY-lastY;
        if (Math.abs(dx)+Math.abs(dy) > 3) dragMoved = true;
        if (overlayOpen) return;
        rotY += dx*0.005;
        rotX -= dy*0.005;
        rotX = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, rotX));
        gridRotY = rotY;
        gridRotX = rotX;
        lastX=e.clientX; lastY=e.clientY;
      });

      canvas.addEventListener('dblclick', () => {
        if (overlayOpen) { closePanel(); return; }
        rotY=Math.PI/6; rotX=-Math.PI/12; scrollP=0; panX=OX; panY=OY;
        gridRotY=Math.PI/6; gridRotX=-Math.PI/12;
      });

      canvas.addEventListener('mousemove', e => {
        const s = getPageScale();
        const mx = e.clientX / s, my = e.clientY / s;
        let hit = false;
        for (const h of descHits) {
          if (Math.hypot(h.x - mx, h.y - my) < 75) { hit = true; break; }
        }
        window.__canvasHoverable = hit;
      });

      canvas.addEventListener('click', e => {
        if (dragMoved) return;
        const s = getPageScale();
        const mx=e.clientX/s, my=e.clientY/s;
        let nearest=null, minDist=75;
        for (const h of descHits) {
          const d=Math.hypot(h.x-mx, h.y-my);
          if (d<minDist) { minDist=d; nearest=h; }
        }
        if (nearest) openPanel(nearest.id, nearest.type);
      });

      document.getElementById('panelClose').addEventListener('click', closePanel);
      document.addEventListener('keydown', e => { if (e.key==='Escape') closePanel(); });

      requestAnimationFrame(draw);
    </script>

    <script src="scale.js"></script>
    <script src="cursor.js"></script>
  </body>
</html>
