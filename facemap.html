    <script>
      const PROFILES = {
        jay: {
          name: 'Jay',
          desc: '대한민국 6인조 보이그룹 ENHYPEN의 멤버',

        iroha: {

          desc: '대한민국 5인조 걸그룹 ILLIT의 멤버',
          photo: 'images/facemap/photo-iroha.png',
        },
        enrique: {
          name: '엔리케',
          desc: '설명 추가 예정',
          photo: 'images/facemap/photo-enrique.png',
        },
        kosoyoung: {
          name: 'Ko So young',
          desc: '대한민국의 배우',
          photo: 'images/facemap/photo-kosoyoung.png',
        },
        jeonjihyun: {
          name: '전지현',
          desc: '대한민국의 배우',
          photo: 'images/facemap/photo-jeonjihyun.png',
        },
        jangwonyoung: {
          name: '장원영',
          desc: '대한민국 6인조 걸그룹 IVE의 멤버',
          photo: 'images/facemap/photo-jangwonyoung.png',
        },
        rei: {
          name: 'Rei',
          desc: '대한민국 6인조 걸그룹 IVE의 멤버',
          photo: 'images/facemap/photo-rei.png',
        },
        marilyn: {
          name: '마릴린 먼로',
          desc: '설명 추가 예정',
          photo: 'images/facemap/photo-marilyn.png',
        },
        cindy: {
          name: '신디 크로포드',
          desc: '설명 추가 예정',
          photo: 'images/facemap/photo-cindy.png',
        },
        bibi: {
          name: 'BIBI',
          desc: '대한민국의 솔로 아티스트이자 배우',
          photo: 'images/facemap/photo-bibi.png',
        },
        jenny: {
          name: 'Jenny',
          desc: '설명 추가 예정',
          photo: 'images/facemap/photo-jenny.png',
        },
      };

      const bubble = document.getElementById('profileBubble');
      const bPhoto = document.getElementById('bubblePhoto');
      const bName = document.getElementById('bubbleName');
      const bDesc = document.getElementById('bubbleDesc');
      const page = document.querySelector('.faceMapPage');
      let activeDot = null;
      const BUBBLE_W = 418,
        BUBBLE_H = 172;

      document.querySelectorAll('[data-profile]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (activeDot === btn && bubble.classList.contains('active')) {
            bubble.classList.remove('active');
            btn.classList.remove('active');
            activeDot = null;
            return;
          }
          if (activeDot) activeDot.classList.remove('active');
          activeDot = btn;
          btn.classList.add('active');
          const p = PROFILES[btn.dataset.profile];
          bPhoto.src = p.photo;
          bName.textContent = p.name;
          bDesc.textContent = p.desc;

          const s = window.innerWidth / 1920;
          const btnRect = btn.getBoundingClientRect();
          const pageRect = page.getBoundingClientRect();
          const dotCx = (btnRect.left - pageRect.left + btnRect.width / 2) / s;
          const dotTop = (btnRect.top - pageRect.top) / s;
          const dotH = btnRect.height / s;

          let left = dotCx - BUBBLE_W / 2;
          let top = dotTop - BUBBLE_H + 14;

          left = Math.max(8, Math.min(left, 1920 - BUBBLE_W - 8));
          if (top < 8) top = dotTop + dotH + 2;

          bubble.style.left = left + 'px';
          bubble.style.top = top + 'px';
          bubble.classList.add('active');
        });
      });

      document.addEventListener('click', () => {
        bubble.classList.remove('active');
        if (activeDot) activeDot.classList.remove('active');
        activeDot = null;
      });
    </script>
