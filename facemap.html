          photo:

        },
        jeonjihyun: {

          desc: '대한민국의 배우',
          photo:
            'https://www.figma.com/api/mcp/asset/c412cb2b-5648-4674-851e-3610ed855564',
        },
        jangwonyoung: {
          name: 'Jang Won young',
          desc: '대한민국 6인조 걸그룹 아이브의 멤버',
          photo:
            'https://www.figma.com/api/mcp/asset/92b06623-6ed9-4c3d-8b1c-5d72c8a4f287',
        },
        rei: {
          name: 'Rei',
          desc: '대한민국 6인조 걸그룹 아이브의 멤버',
          photo:
            'https://www.figma.com/api/mcp/asset/ba1930c2-a19e-47db-9bde-7f91f94ae01c',
        },
        marilyn: {
          name: 'Marilyn Monroe',
          desc: '미국의 배우이자 가수이자 모델',
          photo:
            'https://www.figma.com/api/mcp/asset/abc15e1f-2fb8-43dd-b5f7-50ed78d6714c',
        },
        cindy: {
          name: 'Cindy Crawford',
          desc: '미국의 모델이자 배우',
          photo:
            'https://www.figma.com/api/mcp/asset/1269939e-dcc4-4623-af9b-d48bf79cbc40',
        },
        bibi: {
          name: 'BIBI',
          desc: '대한민국 솔로 아티스트이자 배우',
          photo:
            'https://www.figma.com/api/mcp/asset/7d975221-a25d-4901-b27e-5f9b7210e081',
        },
        jenny: {
          name: 'Jenny',
          desc: '대한민국 4인조 걸그룹 블랙핑크의 멤버이자 솔로 아티스트',
          photo:
            'https://www.figma.com/api/mcp/asset/604d116d-07d1-4c93-a274-172a5943af23',
        },
      };

      const bubble = document.getElementById('profileBubble');
      const bPhoto = document.getElementById('bubblePhoto');
      const bName = document.getElementById('bubbleName');
      const bDesc = document.getElementById('bubbleDesc');
      const page = document.querySelector('.faceMapPage');
      let activeDot = null;

      document.querySelectorAll('[data-profile]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (activeDot === btn && bubble.classList.contains('active')) {
            bubble.classList.remove('active');
            activeDot = null;
            return;
          }
          activeDot = btn;
          const p = PROFILES[btn.dataset.profile];
          bPhoto.src = p.photo;
          bName.textContent = p.name;
          bDesc.textContent = p.desc;

          const BUBBLE_W = 436,
            BUBBLE_H = 156;
          const btnRect = btn.getBoundingClientRect();
          const pageRect = page.getBoundingClientRect();
          const dotCx = btnRect.left - pageRect.left + btnRect.width / 2;
          const dotTop = btnRect.top - pageRect.top;

          let left = dotCx - BUBBLE_W / 2;
          let top = dotTop - BUBBLE_H - 18;

          left = Math.max(8, Math.min(left, pageRect.width - BUBBLE_W - 8));
          if (top < 8) top = dotTop + btnRect.height + 18;

          bubble.style.left = left + 'px';
          bubble.style.top = top + 'px';
          bubble.classList.add('active');
        });
      });

      document.addEventListener('click', () => {
        bubble.classList.remove('active');
        activeDot = null;
      });
    </script>
