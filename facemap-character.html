    <script>
      const PROFILES = {
        sakusa: {
          name: 'Kiyoomi Sakusa',
          desc: '애니메이션 · 만화 <하이큐!!>의 등장인물',
          photo: 'images/facemap/photo-char-sakusa.png',
        },
        otorainy: {
          name: 'Oto Rainy',
          desc: '5인 버츄얼 밴드 아이돌 그룹 스코시즘의 멤버이자 버츄얼 유튜버',
          photo: 'images/facemap/photo-char-otorainy.png',
        },
        himmel: {
          name: 'Himmel',
          desc: '판타지 만화 <장송의 프리렌>의 등장인물',
          photo: 'images/facemap/photo-char-himmel.png',
        },
        tomoe: {
          name: 'Tomie',
          desc: '만화작가 이토준지의 대표작 <토미에 시리즈>의 등장인물',
          photo: 'images/facemap/photo-char-tomoe.png',
        },
        touya: {
          name: 'Toya Aoyagi',
          desc: '게임 &lt;프로젝트 세카이 컬러풀 스테이지! feat.하츠네미쿠&gt;의 등장인물',
          photo: 'images/facemap/photo-char-touya.png',
        },
        kohaku: {
          name: 'Ichimura Kohaku',
          desc: '순정만화 <아름다운 초저녁달>의 등장인물',
          photo: 'images/facemap/photo-char-kohaku.png',
        },
        shizuku: {
          name: 'Shizuku Hinomori',
          desc: '게임 &lt;프로젝트 세카이 컬러풀 스테이지! feat.하츠네미쿠&gt;의 등장인물',
          photo: 'images/facemap/photo-char-shizuku.png',
        },
        cluster1: {
          name: 'Kazehaya Tatsumi',
          desc: '게임 <앙상블 스타즈!!>의 등장인물',
          photo: 'images/facemap/photo-char-tatsumi.png',
        },
        cluster2: {
          name: 'Benichidori',
          desc: '애니메이션 · 만화 <던전밥>의 등장인물',
          photo: 'images/facemap/photo-char-beni.png',
        },
        char_new1: {
          name: 'Shimizu Kiyoko',
          desc: '애니메이션 · 만화 <하이큐!!>의 등장인물',
          photo: 'images/facemap/photo-char-kiyoko.png',
        },
        diakurosawa: {
          name: 'Dia Kurosawa',
          desc: '아이돌 프로젝트 시리즈 <br>&lt;러브라이브! 선샤인!!&gt;의 등장인물',
          photo: 'images/facemap/photo-char-diakurosawa.png',
        },
        tsukasa: {
          name: 'Akeuraj Tsukasa',
          desc: '만화 <메달리스트>의 등장인물',
          photo: 'images/facemap/photo-char-tsukasa.png',
        },
        kobeni: {
          name: 'Higashiyama Kobeni',
          desc: '만화 <체인소맨>의 등장인물',
          photo: 'images/facemap/photo-char-kobeni.png',
        },
        cluster1b: {
          name: 'Kazehaya Tatsumi',
          desc: '게임 <앙상블 스타즈!!>의 등장인물',
          photo: 'images/facemap/photo-char-tatsumi.png',
        },
        cluster2b: {
          name: 'Benichidori',
          desc: '애니메이션 · 만화 <던전밥>의 등장인물',
          photo: 'images/facemap/photo-char-beni.png',
        },
      };

      const bubble = document.getElementById('profileBubble');
      const bPhoto = document.getElementById('bubblePhoto');
      const bName = document.getElementById('bubbleName');
      const bDesc = document.getElementById('bubbleDesc');
      let activeDot = null;

      // 동시 반응 그룹: [bubble을 띄울 대표 점, 나머지...] — 대표 점 기준으로 bubble 위치
      const LINKED_GROUPS = [
        ['cluster1', 'cluster1b'],
        ['cluster2', 'cluster2b'],
      ];
      // 클릭한 점 기준으로 bubble 위치 (멀리 떨어진 그룹)
      const LINKED_GROUPS_SELF = [
        ['kobeni'],
      ];
      function getLinkedBtns(btn) {
        const group = [...LINKED_GROUPS, ...LINKED_GROUPS_SELF].find(g => g.includes(btn.dataset.profile));
        if (!group) return [btn];
        return group.flatMap(p => [...document.querySelectorAll('[data-profile="' + p + '"]')]);
      }
      // bubble 위치 기준 버튼: SELF 그룹은 클릭한 버튼, 나머지는 그룹 첫 번째
      function getBubbleAnchor(btn) {
        if (LINKED_GROUPS_SELF.some(g => g.includes(btn.dataset.profile))) return btn;
        const group = LINKED_GROUPS.find(g => g.includes(btn.dataset.profile));
        if (!group) return btn;
        return document.querySelector('[data-profile="' + group[0] + '"]') || btn;
      }

      document.querySelectorAll('[data-profile]').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (activeDot === btn && bubble.classList.contains('active')) {
            bubble.classList.remove('active');
            getLinkedBtns(btn).forEach(b => b.classList.remove('active'));
            activeDot = null;
            return;
          }
          if (activeDot) getLinkedBtns(activeDot).forEach(b => b.classList.remove('active'));
          activeDot = btn;
          getLinkedBtns(btn).forEach(b => b.classList.add('active'));
          const anchor = getBubbleAnchor(btn);
          const p = PROFILES[anchor.dataset.profile];
          bPhoto.src = p.photo;
          bName.textContent = p.name;
          bDesc.innerHTML = p.desc;

          placeBubble(bubble, anchor);
          bubble.classList.add('active');
        });
      });

      document.addEventListener('click', () => {
        bubble.classList.remove('active');
        if (activeDot) getLinkedBtns(activeDot).forEach(b => b.classList.remove('active'));
        activeDot = null;
      });
    </script>
