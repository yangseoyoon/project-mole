    <script>
      const PROFILES = {
        sakusa:    { name: '사쿠사',    desc: '설명 추가 예정', photo: 'images/facemap/photo-char-sakusa.png' },
        otorainy:  { name: 'Oto Rainy', desc: '허블사무소 소속 5인 버츄얼 밴드 아이돌 그룹 스코시즘의 멤버이자 버츄얼 유튜버', photo: 'images/facemap/photo-char-otorainy.png' },
        himmel:    { name: '힘멜',      desc: '설명 추가 예정', photo: 'images/facemap/photo-char-himmel.png' },
        tomoe:     { name: '토모에',    desc: '설명 추가 예정', photo: 'images/facemap/photo-char-tomoe.png' },
        touya:     { name: '토우야',    desc: '설명 추가 예정', photo: 'images/facemap/photo-char-touya.png' },
        kohaku:    { name: '코하쿠',    desc: '설명 추가 예정', photo: 'images/facemap/photo-char-kohaku.png' },
        shizuku:   { name: '시즈쿠',    desc: '설명 추가 예정', photo: 'images/facemap/photo-char-shizuku.png' },
        cluster1:  { name: '타츠미',    desc: '설명 추가 예정', photo: 'images/facemap/photo-char-tatsumi.png' },
        cluster2:  { name: '키요코',    desc: '설명 추가 예정', photo: 'images/facemap/photo-char-kiyoko.png' },
        char_new1: { name: '베니',      desc: '설명 추가 예정', photo: 'images/facemap/photo-char-beni.png' },
      };

      const bubble  = document.getElementById('profileBubble');
      const bPhoto  = document.getElementById('bubblePhoto');
      const bName   = document.getElementById('bubbleName');
      const bDesc   = document.getElementById('bubbleDesc');
      const page    = document.querySelector('.faceMapPage');
      let activeDot = null;
      const BUBBLE_W = 418, BUBBLE_H = 172;

      document.querySelectorAll('[data-profile]').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          if (activeDot === btn && bubble.classList.contains('active')) {
            bubble.classList.remove('active');
            btn.classList.remove('active');
            activeDot = null; return;
          }
          if (activeDot) activeDot.classList.remove('active');
          activeDot = btn;
          btn.classList.add('active');
          const p = PROFILES[btn.dataset.profile];
          bPhoto.src = p.photo;
          bName.textContent = p.name;
          bDesc.textContent = p.desc;

          const s = window.innerWidth / 1920;
          const btnRect  = btn.getBoundingClientRect();
          const pageRect = page.getBoundingClientRect();
          const dotCx  = (btnRect.left - pageRect.left + btnRect.width  / 2) / s;
          const dotTop = (btnRect.top  - pageRect.top) / s;
          const dotH   = btnRect.height / s;

          let left = dotCx - BUBBLE_W / 2;
          let top  = dotTop - BUBBLE_H + 14;

          left = Math.max(8, Math.min(left, 1920 - BUBBLE_W - 8));
          if (top < 8) top = dotTop + dotH + 2;

          bubble.style.left = left + 'px';
          bubble.style.top  = top  + 'px';
          bubble.classList.add('active');
        });
      });

      document.addEventListener('click', () => {
        bubble.classList.remove('active');
        if (activeDot) activeDot.classList.remove('active');
        activeDot = null;
      });
    </script>
