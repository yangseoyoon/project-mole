<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>도움말 | DOT SHIFT</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 다음 슬라이드 이미지 미리 받기 -->
    <link rel="preload" as="image" href="images/help/slides/camera-1.png" />
    <style>
      /* 점 패턴 분석하기 도움말 — PPT 처럼 이미지 슬라이드 + 도움말 패널만.
         슬라이드 이미지: images/help/slides/camera-1~5.png (1920×1080, 패널 없는 화면 캡처)
         다시 캡처하는 방법은 images/help/slides/README.md */
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f0f0f0;
        cursor: pointer;
      }
      /* 1920×1080 무대를 화면에 꽉 차게 (비율이 다르면 가장자리가 조금 잘림) */
      .viewport {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      .slide {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: none;
        user-select: none;
        -webkit-user-drag: none;
      }
      .slide.on { display: block; }

      /* 도움말 패널 (help-tour.css 와 같은 모양, 1920 기준 px) */
      .panel {
        position: absolute;
        width: max-content;
        max-width: 600px;
        min-width: 250px;
        box-sizing: border-box;
        background: #e9f056;
        border: 1px solid #000;
        padding: 60px 34px 30px;
        animation: panelFloat 3s ease-in-out infinite;  /* 위아래로 둥둥 (help-tour.css 와 같은 움직임) */
      }
      @keyframes panelFloat {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-10px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .panel { animation: none; }
      }
      .panel-title {
        position: absolute;
        left: 0; top: 0;
        height: 34px;
        padding: 0 38px;
        display: flex; align-items: center;
        background: #fe6c48;
        font-family: 'Pretendard', sans-serif;
        font-weight: 600;
        font-size: 24px;
        color: #fff;
        white-space: nowrap;
      }
      .panel-next {
        position: absolute;
        right: 0; top: 0;
        width: 80px;
        height: 34px;
        display: flex; align-items: center; justify-content: center;
        background: #fe6c48;
        border: none;
        padding: 0;
        font-family: 'Pretendard', sans-serif;
        font-size: 24px;
        color: #fff;
        cursor: pointer;
      }
      /* 둘째 장부터: 패널 대신 말풍선 (Figma 2138:1694 — 흰 바탕, 왼쪽 아래만 각진 둥근 모서리, 옅은 그림자) */
      .panel.bubble {
        min-width: 0;
        background: #fff;
        border: 0.5px solid #d9d9d9;
        border-radius: 20px 20px 20px 0;
        box-shadow: 4px 4px 6.6px rgba(0, 0, 0, 0.15);
        padding: 20px 26px;
      }
      /* 말풍선 글: 피그마 댓글 말풍선처럼 작게, 왼쪽 정렬 */
      .panel.bubble .panel-text {
        font-size: 17px;
        line-height: 26px;
        font-weight: 400;
        text-align: left;
      }
      .panel.bubble .panel-title,
      .panel.bubble .panel-next { display: none; }
      /* 강조 단어: 글자 뒤에 흰 원(검정 0.5 테두리)을 겹침 (음양오행 설명창 .kw 와 같은 방식) */
      .panel-text .kw { position: relative; }   /* 원은 문단 전체 글자 뒤로 (옆 글자도 가리지 않게) */
      /* 강조 원 (지름 38, 8px 씩 겹침): 흰 바탕 + 검정 0.5 테두리 — 진짜 테두리 요소로 그려 가장자리가 매끈하게 */
      .panel-text .kw-dots {
        position: absolute;
        left: -5px;   /* 글자 시작보다 5px 앞 */
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        gap: 0;
        z-index: -1;
        pointer-events: none;
      }
      .panel-text .kw-dots i {
        width: 38px;
        height: 38px;
        box-sizing: border-box;
        border-radius: 50%;
        background: #fff;
        border: 0.5px solid #000;
      }
      .panel-text .kw-dots i + i { margin-left: -8px; }  /* 원끼리 8px 겹침 */
      .panel-text {
        position: relative;
        isolation: isolate;
        margin: 0;
        font-family: 'Pretendard', sans-serif;
        font-weight: 500;
        font-size: 20px;
        line-height: 32px;
        color: #000;
        word-break: keep-all;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="viewport">
    <div class="stage" id="stage">
      <div class="panel" id="panel" role="dialog" aria-live="polite">
        <div class="panel-title">도움말</div>
        <button class="panel-next" id="next" aria-label="다음">→</button>
        <p class="panel-text" id="text"></p>
      </div>
    </div>
    </div>

    <script>
      (function () {
        // 이미지와 패널 위치(1920×1080 기준, 캡처할 때 화면에서 잰 값)
        const SLIDES = [
          { img: 'camera-1.png', left: 716, top: 462, text: '자신이 어떤 <span class="kw"><span class="kw-dots" aria-hidden="true"><i></i><i></i></span>점 패턴</span>을 가지고 있는지 <span class="kw"><span class="kw-dots" aria-hidden="true" style="left:-1px"><i></i></span>직접</span> 얼굴에<br>점을 찍어 알아볼 수 있습니다.' },
          // 둘째 장부터 말풍선: tail = 말풍선 왼쪽 아래(꼬리)가 닿을 점 — 선명한 구간의 오른쪽 가장자리
          { img: 'camera-2.png', tail: [1176, 400], text: '가이드 선에 맞춰서 얼굴 사진을 찍어주세요.' },   // 얼굴 부분 오른쪽
          { img: 'camera-3.png', tail: [1338, 860], text: '아래 슬라이드로 얼굴크기를 쉽게 맞출 수 있습니다.' },  // 슬라이더 오른쪽
          { img: 'camera-4.png', tail: [1515, 390], text: '얼굴 위에 점을 찍어보세요.' },  // 얼굴 패널 오른쪽 위 (예전 '사진을 클릭해…' 말풍선 자리)
          { img: 'camera-5.png', tail: [725, 310], text: '찍은 점은 패턴으로 재구성됩니다.' },  // 방사형 차트 패널 오른쪽
          { img: 'camera-6.png', tail: [756, 182], text: '점 패턴을 통해 나는 어떤 유형인가를 알아보세요.' },  // 결과 페이지(Figma 2132:1911) 유형 알파벳(EDVS) 왼쪽 위
        ];
        const stage = document.getElementById('stage');
        const panel = document.getElementById('panel');
        const text = document.getElementById('text');
        const nextBtn = document.getElementById('next');

        // 이미지 미리 다 넣어두고 보이는 것만 바꿈
        const imgs = SLIDES.map((s, i) => {
          const img = document.createElement('img');
          img.className = 'slide';
          img.src = 'images/help/slides/' + s.img;
          img.alt = '';
          img.decoding = 'async';
          stage.insertBefore(img, panel);
          return img;
        });

        function fit() {
          const k = Math.max(innerWidth / 1920, innerHeight / 1080);
          stage.style.transform = 'translate(' + (innerWidth - 1920 * k) / 2 + 'px, ' + (innerHeight - 1080 * k) / 2 + 'px) scale(' + k + ')';
        }
        fit();
        addEventListener('resize', fit);

        let i = 0;
        function show(n) {
          i = n;
          imgs.forEach((img, j) => img.classList.toggle('on', j === i));
          const s = SLIDES[i];
          text.innerHTML = s.text;
          // 첫 장은 페이지 소개 패널, 그 뒤는 말풍선
          const bubble = !!s.tail;
          panel.classList.toggle('bubble', bubble);
          if (bubble) {
            // 꼬리(왼쪽 아래)를 tail 점에 붙이고 오른쪽 위로 펼침. 화면 오른쪽 끝(1920)을 넘지 않게 폭 제한 → 넘치면 줄바꿈
            const [tx, ty] = s.tail;
            panel.style.maxWidth = Math.min(400, 1920 - tx - 16) + 'px';
            panel.style.left = tx + 'px';
            panel.style.top = (ty - panel.offsetHeight) + 'px';
          } else {
            panel.style.maxWidth = '';
            panel.style.left = s.left + 'px';
            panel.style.top = s.top + 'px';
          }
          // 마지막 장은 → 대신 X (Figma)
          const last = i === SLIDES.length - 1;
          nextBtn.textContent = last ? 'X' : '→';
          nextBtn.setAttribute('aria-label', last ? '닫기' : '다음');
        }
        // 끝나면(또는 Esc) 카메라로 (#help 없이 → 도움말 없이 바로 촬영)
        function done() {
          location.replace('camera.html');
        }
        function next() { if (i + 1 < SLIDES.length) show(i + 1); else done(); }

        document.addEventListener('click', next);
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') done();
          else if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
          else if (e.key === 'ArrowLeft' && i > 0) show(i - 1);
        });
        show(0);
      })();
    </script>
  </body>
</html>
