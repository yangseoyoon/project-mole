    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Pretendard', sans-serif;
        background: #e9f056;
      }
      /* 1920×1080 구성을 화면에 맞춰 비례 축소/확대 (디자인 1px = var(--gu)).
         기본은 화면 폭 기준(낮은 화면은 세로 스크롤). 16:10 처럼 상대적으로 높은 화면은
         세로를 채우도록 최대 1.2배까지 키우고 좌우를 균등하게 잘라낸다. */
      /* Figma: 위 20px 내림, 아래 20px 은 잘림 */
      /* 넘친 좌우는 body 가 잘라냄 (html 에 overflow 를 두어 body 의 clip 이 화면으로 넘어가지 않게) */
      html {
        overflow-x: hidden;
      }
      body.rwd {
        overflow-x: clip;
        padding-top: 20px;
      }
      .gwPage {
        --gu: min(max(100vw / 1920, 100dvh / 1080), 100vw / 1600);
        position: relative;
        width: calc(1920 * var(--gu));
        height: calc(1080 * var(--gu) - 20px);
        margin-left: calc((100vw - 1920 * var(--gu)) / 2);
        overflow: hidden;
        background: #e9f056;
      }
      /* 기본 그리드 셀 */
      .gwCell {
        position: absolute;
        width: calc(130.5 * var(--gu));
        height: calc(130.5 * var(--gu));
        border: 1px solid #000;
        background: transparent;
        z-index: 0;
      }
      /* 이미지 크롭 셀 */
      .gwCrop {
        position: absolute;
        width: calc(130.5 * var(--gu));
        height: calc(130.5 * var(--gu));
        overflow: hidden;
        border: 1px solid #000;
        z-index: 1;
      }
      .gwCrop img {
        position: absolute;
        display: block;
        max-width: none;
      }
      /* 이미지 셀: gwCell 안에 이미지를 채울 때 사용 */
      .gwCell.has-img {
        overflow: hidden;
        padding: 0;
      }
      .gwCell.has-img > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* 레터 셀 (검정 배경 + 흰 글자 SVG) */
      .gwLetter {
        position: absolute;
        width: calc(130.5 * var(--gu));
        height: calc(130.5 * var(--gu));
        background: #000;
        overflow: hidden;
        border: 1px solid #000;
        z-index: 2;
      }
      .gwLetter img {
        position: absolute;
        top: calc(-0.5 * var(--gu));
        left: calc(-0.5 * var(--gu));
        width: calc(100% + calc(1 * var(--gu)));
        height: calc(100% + calc(1 * var(--gu)));
        display: block;
      }
      /* 페이스 카드 */
      .gwFace {
        position: absolute;
        width: calc(261 * var(--gu));
        height: calc(261 * var(--gu));
        border: 1px solid #000;
        overflow: hidden;
        background: #000;
        z-index: 3;
      }
      .gwFace[onclick] {
        cursor: pointer;
      }
      /* hover 레이어 공통 */
      .gf-default,
      .gf-hover {
        position: absolute;
        inset: 0;
        transition: opacity 0.2s ease;
      }
      .gf-default {
        background: #000;
        opacity: 1;
        z-index: 1;
      }
      .gf-default img {
        position: absolute;
        display: block;
      }
      .gf-hover {
        background: #fff;
        opacity: 0;
        z-index: 2;
        overflow: hidden;
      }
      .gwFace:hover .gf-default {
        opacity: 0;
      }
      .gwFace:hover .gf-hover {
        opacity: 1;
      }
      .gf-hover img {
        position: absolute;
        display: block;
      }
      .gf-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Pretendard', sans-serif;
        font-weight: 600;
        font-size: calc(32 * var(--gu));
        color: #000;
        line-height: calc(44 * var(--gu));
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
      }
      .gf-label-right {
        text-align: right;
        white-space: pre;
      }
    </style>
