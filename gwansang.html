    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Pretendard', sans-serif;
        background: #e9f056;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }
      .gwPage {
        position: fixed;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        background: #e9f056;
        overflow: hidden;
        transform-origin: top left;
      }
      /* 기본 그리드 셀 */
      .gwCell {
        position: absolute;
        width: 130.5px;
        height: 130.5px;
        border: 1px solid #000;
        background: transparent;
        z-index: 0;
      }
      /* 이미지 크롭 셀 */
      .gwCrop {
        position: absolute;
        width: 130.5px;
        height: 130.5px;
        overflow: hidden;
        border: 1px solid #000;
        z-index: 1;
      }
      .gwCrop img {
        position: absolute;
        display: block;
        max-width: none;
      }
      /* 이미지 셀: gwCell 안에 이미지를 채울 때 사용 */
      .gwCell.has-img {
        overflow: hidden;
        padding: 0;
      }
      .gwCell.has-img > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* 레터 셀 (검정 배경 + 흰 글자 SVG) */
      .gwLetter {
        position: absolute;
        width: 130.5px;
        height: 130.5px;
        background: #000;
        overflow: hidden;
        border: 1px solid #000;
        z-index: 2;
      }
      .gwLetter img {
        position: absolute;
        top: -0.5px;
        left: -0.5px;
        width: calc(100% + 1px);
        height: calc(100% + 1px);
        display: block;
      }
      /* 페이스 카드 */
      .gwFace {
        position: absolute;
        width: 261px;
        height: 261px;
        border: 1px solid #000;
        overflow: hidden;
        background: #000;
        z-index: 3;
      }
      .gwFace[onclick] {
        cursor: pointer;
      }
      /* hover 레이어 공통 */
      .gf-default,
      .gf-hover {
        position: absolute;
        inset: 0;
        transition: opacity 0.2s ease;
      }
      .gf-default {
        background: #000;
        opacity: 1;
        z-index: 1;
      }
      .gf-default img {
        position: absolute;
        display: block;
      }
      .gf-hover {
        background: #fff;
        opacity: 0;
        z-index: 2;
        overflow: hidden;
      }
      .gwFace:hover .gf-default { opacity: 0; }
      .gwFace:hover .gf-hover   { opacity: 1; }
      .gf-hover img {
        position: absolute;
        display: block;
      }
      .gf-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Pretendard', sans-serif;
        font-weight: 600;
        font-size: 32px;
        color: #000;
        line-height: 44px;
        text-align: center;
        white-space: nowrap;
        pointer-events: none;
      }
      .gf-label-right {
        text-align: right;
        white-space: pre;
      }
    </style>
