<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>유형 카드 | DOT SHIFT</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="nav.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', sans-serif;
      background: #e9f056;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .typecardPage {
      position: fixed;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      overflow: visible;
    }

    .tc-bg {
      position: absolute;
      inset: 0;
      background-image: url('images/cam/cam-bg1.png');
      background-size: 960px 540px;
      background-repeat: repeat;
      z-index: 0;
    }

    .deco-circle {
      position: absolute;
      border-radius: 50%;
      border: 1px solid #000;
      pointer-events: none;
      z-index: 1;
    }

    /* 진행 단계 */
    .tc-steps {
      position: absolute;
      right: 120px; top: 90px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 10;
    }
    .tc-step { font-size: 13px; font-weight: 500; color: #000; opacity: 0.35; }
    .tc-step.active { opacity: 1; color: #ea5c3a; font-weight: 700; }
    .tc-step-arrow { opacity: 0.3; font-size: 13px; }

    /* 헤더 */
    .tc-header {
      position: absolute;
      left: 120px; top: 80px;
      z-index: 10;
    }
    .tc-label {
      font-size: 13px; font-weight: 500; color: #000;
      opacity: 0.45; letter-spacing: 0.1em; text-transform: uppercase;
    }
    .tc-type-name {
      font-size: 72px; font-weight: 800; color: #000;
      line-height: 1; margin-top: 6px;
    }

    /* ── 카드 래퍼 ── */
    .tc-card-wrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -48%);
      z-index: 10;
      perspective: 1800px;
    }

    /* 카드 크기: 이미지 비율 1502×4096 (≈1:2.73) */
    .flip-card {
      width: 256px;
      height: 698px;
      cursor: grab;
      user-select: none;
    }
    .flip-card:active { cursor: grabbing; }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front,
    .flip-card-back {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      border: 1.5px solid rgba(0,0,0,0.15);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }

    .flip-card-front img,
    .flip-card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .flip-card-back {
      transform: rotateY(180deg);
    }

    /* 플립 힌트 */
    .card-flip-hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(0,0,0,0.3);
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
      background: rgba(255,255,255,0.6);
      padding: 4px 12px;
      border-radius: 100px;
    }

    /* ── 내비게이션 ── */
    .tc-nav {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }
    .tc-nav-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1.5px solid #000;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      font-family: 'Pretendard', sans-serif;
    }
    .tc-nav-btn:hover { background: rgba(0,0,0,0.08); }
    .tc-nav-dots { display: flex; gap: 7px; align-items: center; }
    .tc-nav-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(0,0,0,0.2);
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .tc-nav-dot.cur { background: #000; transform: scale(1.3); }

    /* ── 하단 버튼 ── */
    .tc-actions {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    .tc-btn {
      height: 44px; padding: 0 28px;
      border-radius: 100px;
      border: 1.5px solid #000;
      font-family: 'Pretendard', sans-serif;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; gap: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .tc-btn--primary { background: #000; color: #e9f056; }
    .tc-btn--primary:hover { background: #222; }
    .tc-btn--secondary { background: rgba(255,255,255,0.65); color: #000; }
    .tc-btn--secondary:hover { background: #fff; }
  </style>
</head>
<body>

  <nav class="topNav">
    <a class="navLeft" href="index.html">PROJECT: DOT SHIFT</a>
    <span class="navRight">Everything starts from a dot</span>
  </nav>

  <div class="typecardPage page-scale">
    <div class="tc-bg"></div>


    <!-- 헤더 -->
    <div class="tc-header">
      <div class="tc-label">당신의 점 유형</div>
      <div class="tc-type-name" id="hdrCode">—</div>
    </div>

    <!-- 진행 단계 -->
    <div class="tc-steps">
      <span class="tc-step">사진 찍기</span>
      <span class="tc-step-arrow">›</span>
      <span class="tc-step">점 찍기</span>
      <span class="tc-step-arrow">›</span>
      <span class="tc-step active">유형 분석</span>
      <span class="tc-step-arrow">›</span>
      <span class="tc-step">카드 저장</span>
    </div>

    <!-- 카드 -->
    <div class="tc-card-wrap">
      <div class="flip-card" id="card0">
        <div class="flip-card-inner" id="cardInner">
          <div class="flip-card-front">
            <img id="imgFront" src="" alt="카드 앞면" />
            <div class="card-flip-hint">← 드래그해서 뒤집기</div>
          </div>
          <div class="flip-card-back">
            <img id="imgBack" src="" alt="카드 뒷면" />
          </div>
        </div>
      </div>
    </div>

    <!-- 내비게이션 -->
    <div class="tc-nav">
      <button class="tc-nav-btn" id="prevBtn">‹</button>
      <div class="tc-nav-dots" id="navDots"></div>
      <button class="tc-nav-btn" id="nextBtn">›</button>
    </div>

    <!-- 하단 버튼 -->
    <div class="tc-actions">
      <button class="tc-btn tc-btn--secondary" onclick="window.location.href='result.html'">← 결과로 돌아가기</button>
      <button class="tc-btn tc-btn--primary" id="saveBtn">카드 저장하기 ↓</button>
    </div>
  </div>

  <nav class="bottomNav">
    <div class="bn-inner">
      <img class="bn-logo-l" style="width:23.456px;height:29.129px;left:40px;top:22.99px" src="images/nav/logo-D.svg" alt="">
      <img class="bn-logo-l" style="width:29.935px;height:29.935px;left:66.65px;top:22.59px" src="images/nav/logo-O.svg" alt="">
      <img class="bn-logo-l" style="width:22.571px;height:29.129px;left:98.09px;top:22.99px" src="images/nav/logo-T.svg" alt="">
      <img class="bn-logo-l" style="width:21.726px;height:30.015px;left:134.06px;top:22.59px" src="images/nav/logo-S.svg" alt="">
      <img class="bn-logo-l" style="width:23.336px;height:29.129px;left:160.53px;top:22.99px" src="images/nav/logo-H.svg" alt="">
      <img class="bn-logo-l" style="width:4.426px;height:29.129px;left:189.82px;top:22.99px" src="images/nav/logo-I.svg" alt="">
      <img class="bn-logo-l" style="width:18.065px;height:29.129px;left:200.16px;top:22.99px" src="images/nav/logo-F.svg" alt="">
      <img class="bn-logo-l" style="width:22.571px;height:29.129px;left:221.73px;top:22.99px" src="images/nav/logo-T.svg" alt="">
      <a class="bn-badge bn-badge--h" href="index.html">H</a>
      <button class="bn-badge bn-badge--b" onclick="history.back()">B</button>
      <button class="bn-item" style="left:450px" onclick="window.location.href='index.html'">
        <span>프로젝트 알아보기</span><img src="images/nav/nav-arrow.svg" alt="">
      </button>
      <button class="bn-item" style="left:790px" onclick="window.location.href='camera.html'">
        <span>점 패턴 분석하기</span><img src="images/nav/nav-arrow.svg" alt="">
      </button>
      <button class="bn-item" style="left:1130px" onclick="window.location.href='facemap-celeb.html'">
        <span>얼굴 지도 살펴보기</span><img src="images/nav/nav-arrow.svg" alt="">
      </button>
      <button class="bn-item" style="left:1470px" onclick="window.location.href='gwansang.html'">
        <span>관상학 알아보기</span><img src="images/nav/nav-arrow.svg" alt="">
      </button>
      <div class="bn-right-bg"></div><button class="bn-help-btn">?</button>
    </div>
  </nav>

  <script>
  const TOTAL = 21;

  function pad(n) { return String(n).padStart(2, '0'); }

  // URL ?card=3 또는 localStorage 기반으로 초기 카드 결정
  function getInitialIndex() {
    const params = new URLSearchParams(location.search);
    const cardParam = params.get('card');
    if (cardParam) return Math.max(1, Math.min(TOTAL, parseInt(cardParam))) - 1;
    const stored = parseInt(localStorage.getItem('resultCardNum') || '1');
    return Math.max(0, Math.min(TOTAL - 1, stored - 1));
  }

  let curIdx = getInitialIndex();

  function renderCard(idx) {
    const num = pad(idx + 1);
    document.getElementById('imgFront').src = `images/cards/card${num}-front.png`;
    document.getElementById('imgBack').src  = `images/cards/card${num}-back.png`;
    document.getElementById('hdrCode').textContent = `CARD ${num}`;

    // 내비게이션 도트
    const nd = document.getElementById('navDots');
    nd.innerHTML = Array.from({length: TOTAL}, (_, i) =>
      `<div class="tc-nav-dot${i === idx ? ' cur' : ''}" onclick="goTo(${i})"></div>`
    ).join('');

    // 플립 초기화
    const card = document.getElementById('card0');
    card.classList.remove('flipped');
    const inner = document.getElementById('cardInner');
    inner.style.transition = 'none';
    inner.style.transform = '';
    setTimeout(() => { inner.style.transition = ''; }, 30);
  }

  function goTo(idx) {
    curIdx = (idx + TOTAL) % TOTAL;
    renderCard(curIdx);
  }

  document.getElementById('prevBtn').addEventListener('click', () => goTo(curIdx - 1));
  document.getElementById('nextBtn').addEventListener('click', () => goTo(curIdx + 1));

  renderCard(curIdx);

  // ── 드래그 플립 ───────────────────────────────────────────────
  const card = document.getElementById('card0');
  let startX = 0, isDragging = false;

  card.addEventListener('mousedown', e => { startX = e.clientX; isDragging = true; });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const dx = e.clientX - startX;
    const inner = card.querySelector('.flip-card-inner');
    const base = card.classList.contains('flipped') ? 180 : 0;
    inner.style.transition = 'none';
    inner.style.transform = `rotateY(${base + dx * 0.35}deg)`;
  });
  window.addEventListener('mouseup', e => {
    if (!isDragging) return;
    isDragging = false;
    const dx = e.clientX - startX;
    const inner = card.querySelector('.flip-card-inner');
    inner.style.transition = '';
    inner.style.transform = '';
    if (Math.abs(dx) > 60) card.classList.toggle('flipped');
  });

  card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; isDragging = true; }, { passive: true });
  card.addEventListener('touchmove', e => {
    if (!isDragging) return;
    const dx = e.touches[0].clientX - startX;
    const inner = card.querySelector('.flip-card-inner');
    const base = card.classList.contains('flipped') ? 180 : 0;
    inner.style.transition = 'none';
    inner.style.transform = `rotateY(${base + dx * 0.35}deg)`;
  }, { passive: true });
  card.addEventListener('touchend', e => {
    if (!isDragging) return;
    isDragging = false;
    const dx = e.changedTouches[0].clientX - startX;
    const inner = card.querySelector('.flip-card-inner');
    inner.style.transition = '';
    inner.style.transform = '';
    if (Math.abs(dx) > 60) card.classList.toggle('flipped');
  });

  // ── 카드 저장 ─────────────────────────────────────────────────
  document.getElementById('saveBtn').addEventListener('click', () => {
    const num = pad(curIdx + 1);
    const isFlipped = document.getElementById('card0').classList.contains('flipped');
    const src = `images/cards/card${num}-${isFlipped ? 'back' : 'front'}.png`;
    const a = document.createElement('a');
    a.href = src;
    a.download = `dotshift-card${num}.png`;
    a.click();
  });
  </script>

  <script src="scale.js" defer></script>
  <script src="cursor.js" defer></script>
  <script src="help.js" defer></script>
  <script src="sound.js" defer></script>
</body>
</html>
